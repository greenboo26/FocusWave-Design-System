<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>FocusWave Lab · Karesansui Side Drawer</title>
<style>
:root{--page:#f3f1ec;--sand:#fbfaf6;--ink:#5d625f;--muted:#909590;--line:#d8d5cd;--wood:#d4b386;--wood-dark:#a8794d}
*{box-sizing:border-box}html,body{margin:0;max-width:100%;overflow-x:hidden}body{background:var(--page);font-family:Inter,"Noto Sans SC",system-ui,sans-serif;color:var(--ink)}
main{max-width:1280px;margin:auto;padding:30px 24px 64px}header{display:flex;justify-content:space-between;gap:24px;align-items:flex-start;margin-bottom:16px}.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}h1{font-size:25px;font-weight:500;margin:0 0 8px}.desc{max-width:880px;color:var(--muted);font-size:13px;line-height:1.75}.back{font-size:13px;color:var(--muted);text-decoration:none}
.workspace{display:grid;grid-template-columns:minmax(0,1fr) 286px;gap:0;align-items:stretch;min-height:650px;position:relative}.board-shell{position:relative;z-index:3}.board{position:relative;height:650px;border:10px solid var(--wood);border-right-width:28px;border-radius:24px;background:var(--sand);overflow:hidden;box-shadow:0 13px 36px rgba(74,69,59,.08),inset 0 1px rgba(255,255,255,.5)}.board:after{content:"";position:absolute;right:0;top:0;bottom:0;width:18px;background:linear-gradient(90deg,#ac8055,#d7b88e 48%,#9c6d45);box-shadow:inset 3px 0 6px rgba(84,56,31,.15);z-index:6;pointer-events:none}.sand{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 20% 30%,rgba(91,82,67,.028) 0 .7px,transparent .8px),radial-gradient(circle at 70% 63%,rgba(91,82,67,.022) 0 .65px,transparent .75px),var(--sand);background-size:8px 8px,11px 11px,auto}canvas{position:relative;display:block;width:100%;height:100%;touch-action:none;cursor:default}
.tool-cursor{--angle:0deg;position:absolute;left:0;top:0;pointer-events:none;z-index:5;opacity:0}.tool-cursor.using{opacity:.97}.tool-cursor img{display:block;filter:drop-shadow(0 5px 4px rgba(58,40,24,.22));transform-origin:28% 74%;user-select:none}.tool-cursor.fine img{width:150px;transform:translate(-35px,-116px) rotate(calc(var(--angle) - 44deg))}.tool-cursor.medium img{width:145px;transform:translate(-34px,-112px) rotate(calc(var(--angle) - 44deg))}.tool-cursor.coarse img{width:136px;transform:translate(-32px,-106px) rotate(calc(var(--angle) - 44deg))}.tool-cursor.flatten img{width:150px;transform:translate(-38px,-112px) rotate(calc(var(--angle) - 44deg))}
.drawer-bay{position:relative;overflow:hidden;min-width:0;background:linear-gradient(90deg,rgba(188,157,118,.06),rgba(188,157,118,.015));border-radius:0 24px 24px 0}.drawer-bay:before{content:"";position:absolute;left:0;top:38px;bottom:38px;width:10px;background:linear-gradient(90deg,#9f7047,#d6b58b 62%,#a6754c);box-shadow:5px 0 12px rgba(75,50,29,.10);z-index:4}.drawer{position:absolute;left:-240px;top:198px;width:270px;transition:left .38s cubic-bezier(.2,.72,.2,1);filter:drop-shadow(0 10px 13px rgba(67,46,29,.18));will-change:left}.drawer.open{left:8px}.drawer-img{display:block;width:270px;height:auto;user-select:none;pointer-events:none}.drawer-toggle{position:absolute;right:-1px;top:82px;width:33px;height:72px;border:0;background:transparent;cursor:pointer;z-index:5}.drawer-toggle:after{content:"";position:absolute;right:4px;top:17px;width:9px;height:38px;border-radius:8px;background:rgba(102,70,39,.26);box-shadow:inset 1px 1px 2px rgba(58,38,21,.18)}
.hit{position:absolute;border:0;background:transparent;cursor:pointer;z-index:3;padding:0}.hit:focus-visible{outline:1px solid rgba(92,78,61,.45);border-radius:10px}.hit.active:after{content:"";position:absolute;width:8px;height:8px;border-radius:50%;background:#6e826f;right:8px;top:8px;box-shadow:0 0 0 4px rgba(110,130,111,.13)}.hit.fine{left:4%;top:8%;width:34%;height:58%}.hit.medium{left:31%;top:22%;width:30%;height:49%}.hit.coarse{left:53%;top:31%;width:26%;height:44%}.hit.flatten{left:68%;top:30%;width:27%;height:50%}
.drawer-hint{position:absolute;left:20px;right:14px;top:156px;color:#9a8f83;font-size:11px;line-height:1.6;transition:opacity .2s}.drawer.open~.drawer-hint{opacity:0}.controls{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-top:11px;font-size:12px;color:var(--muted)}.actions{display:flex;gap:8px}.actions button{border:0;background:transparent;color:#858a85;font:inherit;font-size:12px;padding:5px 7px;cursor:pointer}.actions button:hover{color:#5f645f}.scale-note{font-variant-numeric:tabular-nums}
@media(max-width:900px){main{padding-left:14px;padding-right:14px}.workspace{grid-template-columns:minmax(0,1fr) 210px}.board{height:560px}.drawer{width:205px;left:-178px;top:190px}.drawer.open{left:6px}.drawer-img{width:205px}.drawer-toggle{top:61px;height:58px}.drawer-hint{display:none}.tool-cursor.fine img{width:126px;transform:translate(-30px,-98px) rotate(calc(var(--angle) - 44deg))}.tool-cursor.medium img{width:121px;transform:translate(-29px,-95px) rotate(calc(var(--angle) - 44deg))}.tool-cursor.coarse img{width:114px;transform:translate(-27px,-89px) rotate(calc(var(--angle) - 44deg))}.tool-cursor.flatten img{width:126px;transform:translate(-31px,-94px) rotate(calc(var(--angle) - 44deg))}}
@media(max-width:680px){header,.controls{display:block}.workspace{grid-template-columns:1fr}.drawer-bay{position:absolute;right:0;top:0;bottom:0;width:200px;z-index:8;pointer-events:none}.drawer{pointer-events:auto}.board{height:520px}.back{display:inline-block;margin-top:14px}.actions{margin-top:7px}}
</style>
</head>
<body><main>
<header><div><div class="eyebrow">FocusWave / isolated PoC / learned side-drawer interaction</div><h1>枯山水 · 真实庭具 / 侧边抽屉</h1><div class="desc">参考真实桌下抽屉和桌面端 persistent drawer：工具仓打开时占据预留侧边空间，不覆盖白砂、不撑宽页面。先在抽屉中选庭具；真正按下白砂开始操作时，庭具才“拿到手上”，并随拖动方向转动；松手后庭具从沙面消失。</div></div><a class="back" href="./index.html">← 返回实验目录</a></header>
<div class="workspace">
  <div class="board-shell"><div class="board" id="board"><div class="sand"></div><canvas id="garden"></canvas><div class="tool-cursor" id="toolCursor"><img id="cursorImg" alt=""/></div></div></div>
  <aside class="drawer-bay" aria-label="庭具收纳区域">
    <div class="drawer" id="drawer"><img class="drawer-img" alt="木质庭具抽屉" src="./assets/karesansui/tray.webp"/><button class="drawer-toggle" id="drawerToggle" aria-label="打开或收起庭具抽屉"></button><button class="hit fine" data-tool="fine" aria-label="细耙 7 齿"></button><button class="hit medium" data-tool="medium" aria-label="中耙 5 齿"></button><button class="hit coarse" data-tool="coarse" aria-label="粗耙 3 齿"></button><button class="hit flatten" data-tool="flatten" aria-label="平整棒"></button></div>
    <div class="drawer-hint">点击木拉手<br/>拉出庭具盘</div>
  </aside>
</div>
<div class="controls"><span id="status">0 actions · 尚未选择庭具</span><span class="scale-note" id="scaleNote">打开右侧抽屉选择工具</span><div class="actions"><button id="undo">撤销</button><button id="reset">重置白砂</button></div></div>
</main>
<script type="module">
import { getStrokePoints } from 'https://esm.sh/perfect-freehand@1.2.3';
const ASSETS={fine:'./assets/karesansui/fine.webp',medium:'./assets/karesansui/medium.webp',coarse:'./assets/karesansui/coarse.webp',flatten:'./assets/karesansui/flatten.webp'};
const LABELS={fine:'细耙 7 齿',medium:'中耙 5 齿',coarse:'粗耙 3 齿',flatten:'平整棒'};
const specs={fine:{teeth:7,spacing:15,width:1.15,alpha:.50,contact:90},medium:{teeth:5,spacing:19,width:1.25,alpha:.52,contact:76},coarse:{teeth:3,spacing:28,width:1.4,alpha:.55,contact:56},flatten:{eraseWidth:104,contact:104}};
const canvas=document.querySelector('#garden'),ctx=canvas.getContext('2d'),board=document.querySelector('#board'),drawer=document.querySelector('#drawer'),toolCursor=document.querySelector('#toolCursor'),cursorImg=document.querySelector('#cursorImg'),status=document.querySelector('#status'),scaleNote=document.querySelector('#scaleNote');let tool=null,actions=[],current=null,lastScreen=null,lastAngle=0;
function dpr(){return Math.min(devicePixelRatio||1,2)}function fit(){const r=canvas.getBoundingClientRect(),p=dpr(),w=Math.round(r.width*p),h=Math.round(r.height*p);if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;redraw()}}
function localPoint(e){const r=canvas.getBoundingClientRect(),p=dpr();return[(e.clientX-r.left)*p,(e.clientY-r.top)*p,e.pressure||.5]}
function cleanPoints(points){if(points.length<2)return points.map(p=>({point:[p[0],p[1]]}));return getStrokePoints(points,{size:1,thinning:0,smoothing:.88,streamline:.66,simulatePressure:false})}
function normalAt(pts,i){const a=pts[Math.max(0,i-1)].point,b=pts[Math.min(pts.length-1,i+1)].point;let dx=b[0]-a[0],dy=b[1]-a[1],len=Math.hypot(dx,dy)||1;dx/=len;dy/=len;return[-dy,dx]}
function renderRake(a){const s=specs[a.tool],pts=cleanPoints(a.points);if(pts.length<2)return;ctx.save();ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=s.width*dpr();ctx.strokeStyle=`rgba(125,118,106,${s.alpha})`;const c=(s.teeth-1)/2;for(let t=0;t<s.teeth;t++){const off=(t-c)*s.spacing*dpr();ctx.beginPath();pts.forEach((sp,i)=>{const n=normalAt(pts,i),x=sp.point[0]+n[0]*off,y=sp.point[1]+n[1]*off;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke()}ctx.restore()}
function renderFlatten(a){const pts=cleanPoints(a.points);if(pts.length<2)return;ctx.save();ctx.globalCompositeOperation='destination-out';ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=specs.flatten.eraseWidth*dpr();ctx.beginPath();pts.forEach((sp,i)=>i?ctx.lineTo(sp.point[0],sp.point[1]):ctx.moveTo(sp.point[0],sp.point[1]));ctx.stroke();ctx.restore()}
function renderAction(a){a.tool==='flatten'?renderFlatten(a):renderRake(a)}function updateStatus(){if(!tool){status.textContent=`${actions.length} actions · 尚未选择庭具`;scaleNote.textContent='打开右侧抽屉选择工具';return}const s=specs[tool];status.textContent=`${actions.length} actions · ${LABELS[tool]}`;scaleNote.textContent=tool==='flatten'?`接触宽度 ${s.contact}px`:`接触宽度 ${s.contact}px · 齿距 ${s.spacing}px`}function redraw(){ctx.clearRect(0,0,canvas.width,canvas.height);actions.forEach(renderAction);if(current)renderAction(current);updateStatus()}
function moveCursor(e){const r=board.getBoundingClientRect();toolCursor.style.left=`${e.clientX-r.left}px`;toolCursor.style.top=`${e.clientY-r.top}px`;if(lastScreen){const dx=e.clientX-lastScreen[0],dy=e.clientY-lastScreen[1];if(Math.hypot(dx,dy)>2){const raw=Math.atan2(dy,dx)*180/Math.PI;lastAngle=lastAngle*.68+raw*.32;toolCursor.style.setProperty('--angle',`${lastAngle}deg`)}}lastScreen=[e.clientX,e.clientY]}
canvas.addEventListener('pointerenter',e=>{lastScreen=[e.clientX,e.clientY]});canvas.addEventListener('pointerleave',()=>{if(!current){toolCursor.classList.remove('using');lastScreen=null}});canvas.addEventListener('pointermove',e=>{if(current)moveCursor(e);if(!current||!canvas.hasPointerCapture(e.pointerId))return;const p=localPoint(e),last=current.points.at(-1);if(Math.hypot(p[0]-last[0],p[1]-last[1])>1.8*dpr())current.points.push(p);redraw()});canvas.addEventListener('pointerdown',e=>{if(!tool)return;drawer.classList.remove('open');canvas.setPointerCapture(e.pointerId);current={tool,points:[localPoint(e)]};lastScreen=[e.clientX,e.clientY];moveCursor(e);toolCursor.classList.add('using');redraw()});function finish(e){if(!current)return;if(current.points.length>1)actions.push(current);current=null;toolCursor.classList.remove('using');try{canvas.releasePointerCapture(e.pointerId)}catch{}redraw()}canvas.addEventListener('pointerup',finish);canvas.addEventListener('pointercancel',finish);
document.querySelector('#drawerToggle').addEventListener('click',()=>drawer.classList.toggle('open'));drawer.querySelectorAll('[data-tool]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();tool=b.dataset.tool;drawer.querySelectorAll('[data-tool]').forEach(x=>x.classList.toggle('active',x===b));toolCursor.className=`tool-cursor ${tool}`;cursorImg.src=ASSETS[tool];redraw()}));document.querySelector('#undo').addEventListener('click',()=>{actions.pop();redraw()});document.querySelector('#reset').addEventListener('click',()=>{actions=[];current=null;toolCursor.classList.remove('using');redraw()});new ResizeObserver(fit).observe(canvas);fit();
</script></body></html>
