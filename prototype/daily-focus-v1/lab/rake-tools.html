<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>FocusWave Lab · Karesansui Tools</title>
  <style>
    :root{--page:#f3f1ec;--sand:#fbfaf6;--ink:#5d625f;--muted:#909590;--line:#d8d5cd;--wood:#c7a477;--wood-hi:#e4c99f;--wood-mid:#b58e60;--wood-deep:#7b5a39}
    *{box-sizing:border-box}
    body{margin:0;background:var(--page);font-family:Inter,"Noto Sans SC",system-ui,sans-serif;color:var(--ink)}
    main{max-width:1120px;margin:0 auto;padding:34px 24px 70px}
    header{display:flex;justify-content:space-between;gap:24px;align-items:flex-start;margin-bottom:18px}
    .eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
    h1{font-size:25px;font-weight:500;margin:0 0 8px}
    .desc{max-width:820px;color:var(--muted);font-size:13px;line-height:1.7}
    .back{font-size:13px;color:var(--muted);text-decoration:none}
    .board{position:relative;border:1px solid #d4d0c7;border-radius:20px;overflow:hidden;background:var(--sand);box-shadow:0 12px 35px rgba(74,69,59,.06)}
    .sand{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 20% 30%,rgba(91,82,67,.028) 0 0.7px,transparent .8px),radial-gradient(circle at 70% 63%,rgba(91,82,67,.022) 0 0.65px,transparent .75px),var(--sand);background-size:8px 8px,11px 11px,auto}
    canvas{position:relative;display:block;width:100%;height:620px;touch-action:none;cursor:none}

    .tool-cursor{position:absolute;left:0;top:0;width:72px;height:88px;pointer-events:none;z-index:5;opacity:0;transform:translate(-36px,-72px) rotate(-7deg);transition:opacity .08s ease}
    .tool-cursor.visible{opacity:.94}
    .tool-cursor .tool-entity{left:36px;top:40px;transform:translate(-50%,-50%);filter:drop-shadow(0 4px 3px rgba(66,48,30,.22))}

    .tool-area{margin-top:18px}
    .tray-wrap{position:relative;padding:8px 14px 18px}
    .tool-tray{position:relative;height:126px;border-radius:24px 24px 18px 18px;background:
      linear-gradient(180deg,rgba(255,255,255,.34),transparent 16%),
      repeating-linear-gradient(2deg,rgba(101,70,38,.045) 0 1px,transparent 1px 8px),
      linear-gradient(180deg,#d9b98b 0%,#c49a68 55%,#ad8050 100%);
      border:1px solid rgba(107,77,44,.36);
      box-shadow:0 13px 23px rgba(78,55,31,.17),inset 0 2px rgba(255,255,255,.45),inset 0 -8px 12px rgba(89,58,30,.13)}
    .tool-tray:before{content:"";position:absolute;left:18px;right:18px;top:17px;bottom:20px;border-radius:16px;background:
      repeating-linear-gradient(4deg,rgba(90,59,31,.035) 0 1px,transparent 1px 9px),
      linear-gradient(180deg,#c9a372,#ddb98a 100%);
      box-shadow:inset 0 7px 12px rgba(69,44,23,.24),inset 0 -2px 3px rgba(255,255,255,.38)}
    .tool-tray:after{content:"";position:absolute;left:28px;right:28px;bottom:-8px;height:13px;border-radius:50%;background:rgba(73,49,29,.13);filter:blur(7px);z-index:-1}

    .tool-rest{position:absolute;top:14px;width:25%;height:96px;cursor:pointer;z-index:2;outline:none}
    .tool-rest:nth-child(1){left:0}.tool-rest:nth-child(2){left:25%}.tool-rest:nth-child(3){left:50%}.tool-rest:nth-child(4){left:75%}
    .tool-rest:before{content:"";position:absolute;left:24%;right:24%;bottom:17px;height:9px;border-radius:50%;background:rgba(84,54,28,.12);filter:blur(4px);transition:.18s ease}
    .tool-rest.active:before{left:18%;right:18%;background:rgba(84,54,28,.20);filter:blur(6px)}
    .tool-rest .tool-entity{transition:transform .18s ease,filter .18s ease}
    .tool-rest:nth-child(1) .tool-entity{transform:translate(-50%,-50%) rotate(-13deg) scale(1.55)}
    .tool-rest:nth-child(2) .tool-entity{transform:translate(-50%,-50%) rotate(-5deg) scale(1.55)}
    .tool-rest:nth-child(3) .tool-entity{transform:translate(-50%,-50%) rotate(8deg) scale(1.55)}
    .tool-rest:nth-child(4) .tool-entity{transform:translate(-50%,-50%) rotate(-9deg) scale(1.55)}
    .tool-rest.active .tool-entity{transform:translate(-50%,-62%) rotate(-4deg) scale(1.66);filter:drop-shadow(0 9px 5px rgba(75,49,26,.28))}

    .tool-entity{--head:30px;--teeth-width:24px;position:absolute;left:50%;top:49px;width:66px;height:54px;pointer-events:none;transform-origin:50% 72%}
    .handle{position:absolute;left:50%;top:0;width:5px;height:34px;border-radius:4px;background:
      linear-gradient(90deg,#805d39 0%,#c59c69 24%,#ecd0a2 48%,#b98956 72%,#755334 100%);
      transform:translateX(-50%) rotate(-1deg);box-shadow:1px 1px 1px rgba(58,37,19,.25),inset 1px 0 rgba(255,255,255,.25)}
    .handle:after{content:"";position:absolute;left:1px;top:2px;width:1px;height:29px;background:rgba(255,255,255,.18)}
    .rake-head{position:absolute;left:50%;top:28px;width:var(--head);height:6px;border-radius:5px;background:
      linear-gradient(180deg,#efd4a8 0%,#c49762 52%,#8e663e 100%);
      transform:translateX(-50%) perspective(20px) rotateX(5deg);box-shadow:0 2px 2px rgba(62,39,20,.25),inset 0 1px rgba(255,255,255,.35)}
    .teeth{position:absolute;left:50%;top:33px;width:var(--teeth-width);height:18px;transform:translateX(-50%);display:flex;justify-content:space-between;align-items:flex-start}
    .teeth i{display:block;width:2px;height:17px;border-radius:1px 1px 2px 2px;background:linear-gradient(90deg,#795535,#d0a772 52%,#8e663e);box-shadow:1px 1px 1px rgba(64,40,21,.18)}
    .fine{--head:29px;--teeth-width:22px}.medium{--head:31px;--teeth-width:24px}.coarse{--head:27px;--teeth-width:19px}
    .flatten{--head:50px}.flatten .handle{height:30px}.flatten .rake-head{top:27px;height:10px;border-radius:8px;background:linear-gradient(180deg,#f0d4a7,#c0945f 54%,#8b633b)}.flatten .teeth{display:none}

    .tool-labels{display:grid;grid-template-columns:repeat(4,1fr);margin:3px 22px 0;font-size:10px;color:#8a765f;text-align:center;letter-spacing:.04em}
    .tool-labels span.active{color:#5f4d3b}
    .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
    .actions button{border:0;background:transparent;color:#8c908b;padding:5px 8px;font:inherit;font-size:11px;cursor:pointer}
    .actions button:hover{color:#626762}
    .footer{display:flex;justify-content:space-between;gap:18px;margin-top:8px;font-size:12px;color:var(--muted);line-height:1.7}
    code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#666b68}
    @media(max-width:760px){canvas{height:500px}.tool-tray{height:116px}.tool-rest .tool-entity{transform:translate(-50%,-50%) scale(1.3)!important}.footer,header{display:block}.back{display:inline-block;margin-top:15px}}
  </style>
</head>
<body>
<main>
  <header>
    <div>
      <div class="eyebrow">FocusWave / isolated PoC / physical karesansui tools</div>
      <h1>枯山水 · 木庭具 / 实体浅槽</h1>
      <div class="desc">庭具按真实器物关系处理：连续木托盘、内凹槽、木纹、厚度和投影；四件工具直接躺在槽里，不再使用卡片式选择框。进入白砂后，当前工具本体替代系统光标，齿宽仍与实际砂纹严格对应。</div>
    </div>
    <a class="back" href="./index.html">← 返回实验目录</a>
  </header>

  <div class="board" id="board">
    <div class="sand"></div>
    <canvas id="garden"></canvas>
    <div class="tool-cursor" id="toolCursor" aria-hidden="true"></div>
  </div>

  <div class="tool-area">
    <div class="tray-wrap">
      <div class="tool-tray" id="toolTray" aria-label="庭具木托盘">
        <div class="tool-rest active" data-tool="fine" title="细耙 · 7 齿"><div class="tool-entity fine"><span class="handle"></span><span class="rake-head"></span><span class="teeth"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span></div></div>
        <div class="tool-rest" data-tool="medium" title="中耙 · 5 齿"><div class="tool-entity medium"><span class="handle"></span><span class="rake-head"></span><span class="teeth"><i></i><i></i><i></i><i></i><i></i></span></div></div>
        <div class="tool-rest" data-tool="coarse" title="粗耙 · 3 齿"><div class="tool-entity coarse"><span class="handle"></span><span class="rake-head"></span><span class="teeth"><i></i><i></i><i></i></span></div></div>
        <div class="tool-rest" data-tool="flatten" title="平整棒"><div class="tool-entity flatten"><span class="handle"></span><span class="rake-head"></span><span class="teeth"></span></div></div>
      </div>
      <div class="tool-labels" id="toolLabels"><span class="active">细耙 · 7 齿</span><span>中耙 · 5 齿</span><span>粗耙 · 3 齿</span><span>平整棒</span></div>
    </div>
    <div class="actions"><button id="undo">撤销</button><button id="reset">重置白砂</button></div>
  </div>

  <div class="footer">
    <span id="status">0 actions · fine</span>
    <span><code>actions[]</code> 是唯一纹路来源；木庭具只负责交互呈现。</span>
  </div>
</main>

<script type="module">
import { getStrokePoints } from 'https://esm.sh/perfect-freehand@1.2.3';

const canvas=document.querySelector('#garden');
const ctx=canvas.getContext('2d');
const toolTray=document.querySelector('#toolTray');
const toolLabels=document.querySelector('#toolLabels');
const board=document.querySelector('#board');
const toolCursor=document.querySelector('#toolCursor');
const status=document.querySelector('#status');
let tool='fine';
let actions=[];
let current=null;

const specs={
  fine:{teeth:7,spacing:3.6,width:.72,alpha:.56},
  medium:{teeth:5,spacing:5.8,width:.82,alpha:.58},
  coarse:{teeth:3,spacing:9.2,width:.95,alpha:.60},
  flatten:{eraseWidth:54}
};

function entityWidths(name){if(name==='flatten')return {head:50,teeth:0};const spec=specs[name],trace=(spec.teeth-1)*spec.spacing;return {head:Math.round(trace+7),teeth:Math.round(trace)}}
function toolMarkup(name){const w=entityWidths(name);if(name==='flatten')return `<div class="tool-entity flatten" style="--head:${w.head}px"><span class="handle"></span><span class="rake-head"></span><span class="teeth"></span></div>`;return `<div class="tool-entity ${name}" style="--head:${w.head}px;--teeth-width:${w.teeth}px"><span class="handle"></span><span class="rake-head"></span><span class="teeth">${'<i></i>'.repeat(specs[name].teeth)}</span></div>`}
function syncCursorTool(){toolCursor.innerHTML=toolMarkup(tool)}
syncCursorTool();

function dpr(){return Math.min(devicePixelRatio||1,2)}
function fit(){const r=canvas.getBoundingClientRect(),p=dpr();const w=Math.max(1,Math.round(r.width*p)),h=Math.max(1,Math.round(r.height*p));if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;redraw()}}
function localPoint(e){const r=canvas.getBoundingClientRect(),p=dpr();return[(e.clientX-r.left)*p,(e.clientY-r.top)*p,e.pressure||.5]}
function cleanPoints(points){if(points.length<2)return points.map(p=>({point:[p[0],p[1]]}));return getStrokePoints(points,{size:1,thinning:0,smoothing:.86,streamline:.58,simulatePressure:false})}
function normalAt(pts,i){const a=pts[Math.max(0,i-1)].point,b=pts[Math.min(pts.length-1,i+1)].point;let dx=b[0]-a[0],dy=b[1]-a[1];const len=Math.hypot(dx,dy)||1;dx/=len;dy/=len;return[-dy,dx]}
function renderRake(action){const spec=specs[action.tool],smooth=cleanPoints(action.points);if(smooth.length<2)return;ctx.save();ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=spec.width*dpr();ctx.strokeStyle=`rgba(125,118,106,${spec.alpha})`;const center=(spec.teeth-1)/2;for(let tooth=0;tooth<spec.teeth;tooth++){const off=(tooth-center)*spec.spacing*dpr();ctx.beginPath();smooth.forEach((sp,i)=>{const n=normalAt(smooth,i),x=sp.point[0]+n[0]*off,y=sp.point[1]+n[1]*off;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke()}ctx.restore()}
function renderFlatten(action){const smooth=cleanPoints(action.points);if(smooth.length<2)return;ctx.save();ctx.globalCompositeOperation='destination-out';ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=specs.flatten.eraseWidth*dpr();ctx.beginPath();smooth.forEach((sp,i)=>i?ctx.lineTo(sp.point[0],sp.point[1]):ctx.moveTo(sp.point[0],sp.point[1]));ctx.stroke();ctx.restore()}
function renderAction(a){a.tool==='flatten'?renderFlatten(a):renderRake(a)}
function redraw(){ctx.clearRect(0,0,canvas.width,canvas.height);actions.forEach(renderAction);if(current)renderAction(current);status.textContent=`${actions.length} actions · ${tool}`}

function moveToolCursor(e){const r=board.getBoundingClientRect();toolCursor.style.left=`${e.clientX-r.left}px`;toolCursor.style.top=`${e.clientY-r.top}px`}
canvas.addEventListener('pointerenter',e=>{toolCursor.classList.add('visible');moveToolCursor(e)});
canvas.addEventListener('pointerleave',()=>{if(!current)toolCursor.classList.remove('visible')});
canvas.addEventListener('pointermove',e=>{moveToolCursor(e);if(!current||!canvas.hasPointerCapture(e.pointerId))return;const p=localPoint(e),last=current.points[current.points.length-1];if(Math.hypot(p[0]-last[0],p[1]-last[1])>1.4*dpr())current.points.push(p);redraw()});
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);current={tool,points:[localPoint(e)]};toolCursor.classList.add('visible');moveToolCursor(e);redraw()});
function finish(e){if(!current)return;if(current.points.length>1)actions.push(current);current=null;try{canvas.releasePointerCapture(e.pointerId)}catch{}redraw()}
canvas.addEventListener('pointerup',finish);canvas.addEventListener('pointercancel',finish);

toolTray.querySelectorAll('[data-tool]').forEach((rest,index)=>rest.addEventListener('click',()=>{tool=rest.dataset.tool;toolTray.querySelectorAll('[data-tool]').forEach(r=>r.classList.toggle('active',r===rest));toolLabels.querySelectorAll('span').forEach((s,i)=>s.classList.toggle('active',i===index));syncCursorTool();status.textContent=`${actions.length} actions · ${tool}`}));
document.querySelector('#undo').addEventListener('click',()=>{actions.pop();redraw()});
document.querySelector('#reset').addEventListener('click',()=>{actions=[];current=null;redraw()});

new ResizeObserver(fit).observe(canvas);fit();
</script>
</body>
</html>
