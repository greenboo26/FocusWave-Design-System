<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 840" width="1600" height="840">
<defs>
  <filter id="paper" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="3" seed="21" result="noise"/>
    <feColorMatrix in="noise" type="matrix" values="1 0 0 0 .72  0 1 0 0 .70  0 0 1 0 .64  0 0 0 .13 0" result="grain"/>
    <feBlend in="SourceGraphic" in2="grain" mode="multiply"/>
  </filter>
  <filter id="wash" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.018 0.03" numOctaves="2" seed="8" result="t"/>
    <feDisplacementMap in="SourceGraphic" in2="t" scale="9" xChannelSelector="R" yChannelSelector="G" result="d"/>
    <feGaussianBlur in="d" stdDeviation="1.1"/>
  </filter>
  <filter id="edge" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="14" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="6" result="d"/>
    <feGaussianBlur in="d" stdDeviation=".45"/>
  </filter>
  <radialGradient id="leaf" cx="42%" cy="38%" r="68%">
    <stop offset="0" stop-color="#87978a" stop-opacity=".58"/>
    <stop offset=".52" stop-color="#687b6f" stop-opacity=".49"/>
    <stop offset="1" stop-color="#4e6458" stop-opacity=".31"/>
  </radialGradient>
  <radialGradient id="leaf2" cx="38%" cy="34%" r="72%">
    <stop offset="0" stop-color="#9aa79b" stop-opacity=".50"/>
    <stop offset=".7" stop-color="#66786c" stop-opacity=".38"/>
    <stop offset="1" stop-color="#51665a" stop-opacity=".24"/>
  </radialGradient>
  <symbol id="pad" viewBox="-100 -100 200 200">
