<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>FocusWave Lab · Karesansui Inset Drawer</title>
<style>
:root{--page:#f3f1ec;--sand:#fbfaf6;--ink:#5d625f;--muted:#909590;--line:#d8d5cd;--frame:#c5a277;--frame-dark:#9a744c;--frame-light:#dfc29a}
*{box-sizing:border-box}body{margin:0;background:var(--page);font-family:Inter,"Noto Sans SC",system-ui,sans-serif;color:var(--ink)}
main{max-width:1180px;margin:auto;padding:34px 24px 70px}header{display:flex;justify-content:space-between;gap:24px;align-items:flex-start;margin-bottom:18px}.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}h1{font-size:25px;font-weight:500;margin:0 0 8px}.desc{max-width:860px;color:var(--muted);font-size:13px;line-height:1.7}.back{font-size:13px;color:var(--muted);text-decoration:none}
.garden-frame{position:relative;padding-right:30px}.board{position:relative;border:10px solid #d5b58a;border-right-width:34px;border-radius:24px;overflow:hidden;background:var(--sand);box-shadow:0 13px 36px rgba(74,69,59,.08),inset 0 1px rgba(255,255,255,.48)}.board:after{content:"";position:absolute;right:0;top:0;bottom:0;width:24px;background:linear-gradient(90deg,#b88f61,#d7b588 48%,#a9794e);box-shadow:inset 4px 0 8px rgba(91,62,35,.14);z-index:6;pointer-events:none}.sand{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 20% 30%,rgba(91,82,67,.028) 0 .7px,transparent .8px),radial-gradient(circle at 70% 63%,rgba(91,82,67,.022) 0 .65px,transparent .75px),var(--sand);background-size:8px 8px,11px 11px,auto}canvas{position:relative;display:block;width:100%;height:660px;touch-action:none;cursor:default}
.tool-cursor{position:absolute;left:0;top:0;pointer-events:none;z-index:5;opacity:0}.tool-cursor.visible{opacity:.97}.tool-cursor img{display:block;filter:drop-shadow(0 7px 5px rgba(58,40,24,.22));transform-origin:18% 78%;user-select:none}.tool-cursor.fine img{width:184px;transform:translate(-42px,-146px) rotate(-12deg)}.tool-cursor.medium img{width:174px;transform:translate(-40px,-139px) rotate(-11deg)}.tool-cursor.coarse img{width:164px;transform:translate(-38px,-131px) rotate(-10deg)}.tool-cursor.flatten img{width:188px;transform:translate(-45px,-148px) rotate(-10deg)}
.drawer{position:absolute;right:24px;bottom:22px;width:660px;height:270px;z-index:7;transform:translateX(calc(100% - 58px));transition:transform .46s cubic-bezier(.22,.75,.22,1);filter:drop-shadow(0 15px 18px rgba(68,47,30,.20));will-change:transform}.drawer.open{transform:translateX(0)}.drawer-body{position:absolute;inset:0;border-radius:20px 8px 8px 20px;overflow:hidden;background:linear-gradient(180deg,#dfc59f,#bd9366);box-shadow:inset 0 2px rgba(255,255,255,.45),inset 0 -8px 14px rgba(92,60,30,.12)}.drawer-img{position:absolute;left:14px;top:8px;width:612px;height:auto;display:block;user-select:none;pointer-events:none}.drawer-handle{position:absolute;right:-22px;top:91px;width:46px;height:88px;border:0;border-radius:0 16px 16px 0;background:linear-gradient(90deg,#9f774e 0%,#cba577 36%,#e0c298 68%,#a97d51 100%);box-shadow:3px 5px 9px rgba(70,46,27,.22),inset 1px 0 rgba(255,255,255,.35);cursor:pointer;z-index:4}.drawer-handle:before{content:"";position:absolute;left:12px;top:18px;bottom:18px;width:9px;border-radius:8px;background:rgba(104,72,42,.28);box-shadow:inset 1px 1px 2px rgba(70,45,25,.22)}.drawer-handle:after{content:"";position:absolute;left:-10px;top:0;bottom:0;width:12px;background:linear-gradient(90deg,rgba(88,57,32,.20),transparent)}
.hit{position:absolute;border:0;background:transparent;cursor:pointer;z-index:3;padding:0}.hit:focus-visible{outline:1px solid rgba(92,78,61,.45);border-radius:14px}.hit::after{content:"";position:absolute;inset:18%;border-radius:50%;opacity:0;box-shadow:0 0 24px 10px rgba(255,248,231,.82);transition:.16s}.hit.active::after{opacity:.72}.hit.fine{left:4%;top:8%;width:34%;height:58%}.hit.medium{left:31%;top:22%;width:30%;height:49%}.hit.coarse{left:53%;top:31%;width:26%;height:44%}.hit.flatten{left:68%;top:30%;width:27%;height:50%}
.controls{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:10px;font-size:12px;color:var(--muted)}.actions{display:flex;gap:8px}.actions button{border:0;background:transparent;color:#858a85;font:inherit;font-size:12px;padding:5px 7px;cursor:pointer}.actions button:hover{color:#5f645f}.scale-note{font-variant-numeric:tabular-nums}code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#666b68}
@media(max-width:760px){main{padding-left:14px;padding-right:14px}.garden-frame{padding-right:18px}.board{border-right-width:26px}canvas{height:520px}.drawer{right:16px;width:500px;height:214px;transform:translateX(calc(100% - 48px))}.drawer-img{left:10px;top:7px;width:465px}.drawer-handle{right:-18px;top:71px;width:38px;height:72px}.tool-cursor.fine img{width:146px;transform:translate(-34px,-116px) rotate(-12deg)}.tool-cursor.medium img{width:139px;transform:translate(-32px,-111px) rotate(-11deg)}.tool-cursor.coarse img{width:132px;transform:translate(-31px,-105px) rotate(-10deg)}.tool-cursor.flatten img{width:150px;transform:translate(-36px,-118px) rotate(-10deg)}header,.controls{display:block}.actions{margin-top:7px}.back{display:inline-block;margin-top:14px}}
</style>
</head>
<body><main>
<header><div><div class="eyebrow">FocusWave / isolated PoC / inset physical drawer</div><h1>枯山水 · 真实庭具 / 右侧内嵌抽屉</h1><div class="desc">废弃外挂托盘方案。庭具抽屉现在从沙盘右侧木框内部水平滑出：关闭时只露完整木拉手；打开后才看到工具。默认没有选中任何庭具，也不会在沙面悬浮显示耙子；只有从抽屉里选中工具后，实体工具才会进入沙面交互。</div></div><a class="back" href="./index.html">← 返回实验目录</a></header>
<div class="garden-frame"><div class="board" id="board"><div class="sand"></div><canvas id="garden"></canvas><div class="tool-cursor" id="toolCursor"><img id="cursorImg" alt=""/></div></div>
<div class="drawer" id="drawer" aria-label="右侧庭具内嵌抽屉"><div class="drawer-body"><img class="drawer-img" alt="木质庭具抽屉" src="./assets/karesansui/tray.webp"/><button class="hit fine" data-tool="fine" aria-label="细耙 7 齿"></button><button class="hit medium" data-tool="medium" aria-label="中耙 5 齿"></button><button class="hit coarse" data-tool="coarse" aria-label="粗耙 3 齿"></button><button class="hit flatten" data-tool="flatten" aria-label="平整棒"></button></div><button class="drawer-handle" id="drawerToggle" aria-label="打开或收起庭具抽屉"></button></div></div>
<div class="controls"><span id="status">0 actions · 尚未选择庭具</span><span class="scale-note" id="scaleNote">打开右侧抽屉选择工具</span><div class="actions"><button id="undo">撤销</button><button id="reset">重置白砂</button></div></div>
</main>
<script type="module">
import { getStrokePoints } from 'https://esm.sh/perfect-freehand@1.2.3';
const ASSETS={fine:'./assets/karesansui/fine.webp',medium:'./assets/karesansui/medium.webp',coarse:'./assets/karesansui/coarse.webp',flatten:'./assets/karesansui/flatten.webp'};
const LABELS={fine:'细耙 7 齿',medium:'中耙 5 齿',coarse:'粗耙 3 齿',flatten:'平整棒'};
const specs={fine:{teeth:7,spacing:12,width:1.15,alpha:.50,contact:72},medium:{teeth:5,spacing:15,width:1.25,alpha:.52,contact:60},coarse:{teeth:3,spacing:21,width:1.4,alpha:.55,contact:42},flatten:{eraseWidth:96,contact:96}};
const canvas=document.querySelector('#garden'),ctx=canvas.getContext('2d'),board=document.querySelector('#board'),drawer=document.querySelector('#drawer'),toolCursor=document.querySelector('#toolCursor'),cursorImg=document.querySelector('#cursorImg'),status=document.querySelector('#status'),scaleNote=document.querySelector('#scaleNote');let tool=null,actions=[],current=null;
function dpr(){return Math.min(devicePixelRatio||1,2)}
function fit(){const r=canvas.getBoundingClientRect(),p=dpr(),w=Math.round(r.width*p),h=Math.round(r.height*p);if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;redraw()}}
function localPoint(e){const r=canvas.getBoundingClientRect(),p=dpr();return[(e.clientX-r.left)*p,(e.clientY-r.top)*p,e.pressure||.5]}
function cleanPoints(points){if(points.length<2)return points.map(p=>({point:[p[0],p[1]]}));return getStrokePoints(points,{size:1,thinning:0,smoothing:.86,streamline:.58,simulatePressure:false})}
function normalAt(pts,i){const a=pts[Math.max(0,i-1)].point,b=pts[Math.min(pts.length-1,i+1)].point;let dx=b[0]-a[0],dy=b[1]-a[1],len=Math.hypot(dx,dy)||1;dx/=len;dy/=len;return[-dy,dx]}
function renderRake(a){const s=specs[a.tool],pts=cleanPoints(a.points);if(pts.length<2)return;ctx.save();ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=s.width*dpr();ctx.strokeStyle=`rgba(125,118,106,${s.alpha})`;const c=(s.teeth-1)/2;for(let t=0;t<s.teeth;t++){const off=(t-c)*s.spacing*dpr();ctx.beginPath();pts.forEach((sp,i)=>{const n=normalAt(pts,i),x=sp.point[0]+n[0]*off,y=sp.point[1]+n[1]*off;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke()}ctx.restore()}
function renderFlatten(a){const pts=cleanPoints(a.points);if(pts.length<2)return;ctx.save();ctx.globalCompositeOperation='destination-out';ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=specs.flatten.eraseWidth*dpr();ctx.beginPath();pts.forEach((sp,i)=>i?ctx.lineTo(sp.point[0],sp.point[1]):ctx.moveTo(sp.point[0],sp.point[1]));ctx.stroke();ctx.restore()}
function renderAction(a){a.tool==='flatten'?renderFlatten(a):renderRake(a)}
function updateStatus(){if(!tool){status.textContent=`${actions.length} actions · 尚未选择庭具`;scaleNote.textContent='打开右侧抽屉选择工具';return}const s=specs[tool];status.textContent=`${actions.length} actions · ${LABELS[tool]}`;scaleNote.textContent=tool==='flatten'?`接触宽度 ${s.contact}px`:`接触宽度 ${s.contact}px · 齿距 ${s.spacing}px`}
function redraw(){ctx.clearRect(0,0,canvas.width,canvas.height);actions.forEach(renderAction);if(current)renderAction(current);updateStatus()}
function moveCursor(e){const r=board.getBoundingClientRect();toolCursor.style.left=`${e.clientX-r.left}px`;toolCursor.style.top=`${e.clientY-r.top}px`}
canvas.addEventListener('pointerenter',e=>{if(tool){toolCursor.classList.add('visible');moveCursor(e)}});canvas.addEventListener('pointerleave',()=>{if(!current)toolCursor.classList.remove('visible')});canvas.addEventListener('pointermove',e=>{if(tool)moveCursor(e);if(!current||!canvas.hasPointerCapture(e.pointerId))return;const p=localPoint(e),last=current.points.at(-1);if(Math.hypot(p[0]-last[0],p[1]-last[1])>1.4*dpr())current.points.push(p);redraw()});canvas.addEventListener('pointerdown',e=>{if(!tool)return;canvas.setPointerCapture(e.pointerId);current={tool,points:[localPoint(e)]};redraw()});function finish(e){if(!current)return;if(current.points.length>1)actions.push(current);current=null;try{canvas.releasePointerCapture(e.pointerId)}catch{}redraw()}canvas.addEventListener('pointerup',finish);canvas.addEventListener('pointercancel',finish);
document.querySelector('#drawerToggle').addEventListener('click',()=>drawer.classList.toggle('open'));drawer.querySelectorAll('[data-tool]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();tool=b.dataset.tool;drawer.querySelectorAll('[data-tool]').forEach(x=>x.classList.toggle('active',x===b));toolCursor.className=`tool-cursor ${tool}`;cursorImg.src=ASSETS[tool];drawer.classList.remove('open');redraw()}));document.querySelector('#undo').addEventListener('click',()=>{actions.pop();redraw()});document.querySelector('#reset').addEventListener('click',()=>{actions=[];current=null;redraw()});new ResizeObserver(fit).observe(canvas);fit();
</script></body></html>
