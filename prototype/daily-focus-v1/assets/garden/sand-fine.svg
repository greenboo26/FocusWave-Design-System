<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" preserveAspectRatio="none">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0.08" y2="1">
      <stop offset="0" stop-color="#f7f2e8"/>
      <stop offset="0.52" stop-color="#f2ece1"/>
      <stop offset="1" stop-color="#eee7dc"/>
    </linearGradient>
    <radialGradient id="sun" cx="26%" cy="12%" r="95%">
      <stop offset="0" stop-color="#fffdf8" stop-opacity=".70"/>
      <stop offset=".48" stop-color="#fffdf8" stop-opacity=".18"/>
      <stop offset="1" stop-color="#c7b79e" stop-opacity=".035"/>
    </radialGradient>
    <filter id="micro" x="-3%" y="-3%" width="106%" height="106%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.85 0.72" numOctaves="2" seed="431" stitchTiles="stitch" result="n1"/>
      <feColorMatrix in="n1" type="matrix" values="0 0 0 0 .57  0 0 0 0 .54  0 0 0 0 .48  0 0 0 .13 0" result="grain"/>
      <feGaussianBlur in="grain" stdDeviation=".18" result="softgrain"/>
      <feBlend in="SourceGraphic" in2="softgrain" mode="multiply"/>
    </filter>
    <filter id="relief" x="-4%" y="-4%" width="108%" height="108%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.16 0.20" numOctaves="3" seed="73" stitchTiles="stitch" result="noise"/>
      <feDiffuseLighting in="noise" surfaceScale=".55" diffuseConstant=".32" lighting-color="#fffaf0" result="lit">
        <feDistantLight azimuth="228" elevation="66"/>
      </feDiffuseLighting>
      <feBlend in="SourceGraphic" in2="lit" mode="soft-light"/>
    </filter>
    <pattern id="specks" width="19" height="17" patternUnits="userSpaceOnUse">
      <circle cx="3.2" cy="5.3" r=".34" fill="#877960" opacity=".16"/>
      <circle cx="12.3" cy="4.1" r=".28" fill="#fffdf8" opacity=".50"/>
      <circle cx="16.2" cy="12.5" r=".42" fill="#9a8b72" opacity=".10"/>
      <circle cx="7.2" cy="14.1" r=".31" fill="#fff" opacity=".42"/>
    </pattern>
  </defs>
  <rect width="1536" height="1024" fill="url(#base)"/>
  <rect width="1536" height="1024" fill="#f4eee4" filter="url(#relief)" opacity=".52"/>
  <rect width="1536" height="1024" fill="#f5efe5" filter="url(#micro)" opacity=".50"/>
  <rect width="1536" height="1024" fill="url(#specks)" opacity=".72"/>
  <rect width="1536" height="1024" fill="url(#sun)"/>
</svg>