<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" preserveAspectRatio="none">
  <defs>
    <linearGradient id="sandBase" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3ede2"/>
      <stop offset="0.48" stop-color="#eee6d8"/>
      <stop offset="1" stop-color="#e7ddce"/>
    </linearGradient>
    <radialGradient id="light" cx="22%" cy="14%" r="92%">
      <stop offset="0" stop-color="#fff" stop-opacity=".36"/>
      <stop offset=".46" stop-color="#fff" stop-opacity=".09"/>
      <stop offset="1" stop-color="#8c785a" stop-opacity=".05"/>
    </radialGradient>
    <filter id="sandTexture" x="-4%" y="-4%" width="108%" height="108%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.34 0.28" numOctaves="3" seed="91" result="grain"/>
      <feColorMatrix in="grain" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="soft">
        <feFuncR type="linear" slope="0.25" intercept="0.39"/>
        <feFuncG type="linear" slope="0.23" intercept="0.40"/>
        <feFuncB type="linear" slope="0.20" intercept="0.41"/>
      </feComponentTransfer>
      <feDiffuseLighting in="grain" surfaceScale="1.6" diffuseConstant="0.52" lighting-color="#fff7e9" result="lit">
        <feDistantLight azimuth="228" elevation="52"/>
      </feDiffuseLighting>
      <feBlend in="soft" in2="lit" mode="multiply"/>
    </filter>
    <pattern id="speckle" width="31" height="29" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="7" r=".7" fill="#76684f" opacity=".15"/>
      <circle cx="17" cy="5" r=".55" fill="#fffdf7" opacity=".42"/>
      <circle cx="24" cy="18" r=".8" fill="#8e7b5f" opacity=".12"/>
      <circle cx="10" cy="23" r=".65" fill="#fff" opacity=".34"/>
      <circle cx="29" cy="3" r=".45" fill="#7f6e54" opacity=".10"/>
    </pattern>
  </defs>
  <rect width="1536" height="1024" fill="url(#sandBase)"/>
  <rect width="1536" height="1024" filter="url(#sandTexture)" opacity=".42"/>
  <rect width="1536" height="1024" fill="url(#speckle)" opacity=".75"/>
  <rect width="1536" height="1024" fill="url(#light)"/>
</svg>