<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 540" width="300" height="540">
  <defs>
    <filter id="softInk" x="-18%" y="-12%" width="136%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018 0.045" numOctaves="2" seed="11" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.2" xChannelSelector="R" yChannelSelector="G" result="disp"/>
      <feGaussianBlur in="disp" stdDeviation="0.35"/>
    </filter>
    <filter id="wash" x="-25%" y="-20%" width="150%" height="140%">
      <feGaussianBlur stdDeviation="4.2"/>
    </filter>
    <linearGradient id="bodyBase" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#777973" stop-opacity=".42"/>
      <stop offset=".28" stop-color="#4c504b" stop-opacity=".68"/>
      <stop offset=".68" stop-color="#303632" stop-opacity=".82"/>
      <stop offset="1" stop-color="#202622" stop-opacity=".90"/>
    </linearGradient>
    <linearGradient id="finWash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b302c" stop-opacity=".52"/>
      <stop offset="1" stop-color="#777a74" stop-opacity=".10"/>
    </linearGradient>
  </defs>

  <!-- diffuse sumi wash behind the fish -->
  <ellipse cx="150" cy="305" rx="56" ry="174" fill="#414640" opacity=".07" filter="url(#wash)"/>

  <!-- straight-spine silhouette -->
  <g filter="url(#softInk)">
    <path d="M150 111
             C127 118 108 144 101 181
             C94 221 95 278 103 334
             C109 380 121 426 150 455
             C179 426 191 380 197 334
             C205 278 206 221 199 181
             C192 144 173 118 150 111Z"
          fill="url(#bodyBase)"/>

    <!-- pale flank washes -->
    <path d="M124 156 C108 202 111 296 126 374 C132 407 140 432 150 446 C133 424 119 381 114 332 C108 273 108 205 124 156Z"
          fill="#c8c7c0" opacity=".24"/>
    <path d="M176 156 C192 202 189 296 174 374 C168 407 160 432 150 446 C167 424 181 381 186 332 C192 273 192 205 176 156Z"
          fill="#d1d0c9" opacity=".18"/>

    <!-- ink blotches sampled from the approved fish -->
    <path d="M143 137 C153 128 166 140 163 154 C160 167 144 171 136 159 C130 151 135 142 143 137Z" fill="#242925" opacity=".82"/>
    <path d="M126 169 C140 157 161 160 170 177 C176 190 170 207 152 210 C134 214 119 202 119 187 C119 180 121 174 126 169Z" fill="#303531" opacity=".76"/>
    <path d="M142 210 C158 202 176 215 174 231 C172 247 151 252 137 244 C124 237 125 219 142 210Z" fill="#242a26" opacity=".84"/>
    <path d="M117 247 C127 232 147 234 156 249 C164 262 159 279 143 284 C129 288 113 279 111 264 C110 258 112 252 117 247Z" fill="#3a3f3a" opacity=".68"/>
    <path d="M149 266 C168 258 185 273 181 291 C178 307 158 313 143 305 C129 297 131 275 149 266Z" fill="#1f2521" opacity=".88"/>
    <path d="M124 306 C140 295 160 303 165 321 C169 335 158 349 142 349 C128 350 115 339 115 326 C115 317 118 311 124 306Z" fill="#343934" opacity=".74"/>
    <path d="M146 341 C166 333 181 347 178 366 C175 382 155 390 140 380 C126 371 130 350 146 341Z" fill="#242a26" opacity=".86"/>
    <path d="M126 378 C140 367 159 372 167 388 C173 402 166 419 149 424 C132 427 118 416 117 401 C116 392 119 384 126 378Z" fill="#343a35" opacity=".73"/>

    <!-- tail base, perfectly centered -->
    <path d="M137 111 C137 86 132 61 119 33 C133 41 143 55 150 73 C157 55 167 41 181 33 C168 61 163 86 163 111Z"
          fill="#313732" opacity=".48"/>

    <!-- straight, symmetric forked tail -->
    <path d="M149 77 C140 55 124 31 102 12 C103 37 110 63 124 89 C132 103 139 110 148 115Z"
          fill="url(#finWash)" opacity=".92"/>
    <path d="M151 77 C160 55 176 31 198 12 C197 37 190 63 176 89 C168 103 161 110 152 115Z"
          fill="url(#finWash)" opacity=".92"/>

    <!-- pectoral fins -->
    <path d="M112 351 C81 339 51 345 26 369 C58 371 86 381 111 398 C106 381 106 365 112 351Z"
          fill="url(#finWash)" opacity=".85"/>
    <path d="M188 351 C219 339 249 345 274 369 C242 371 214 381 189 398 C194 381 194 365 188 351Z"
          fill="url(#finWash)" opacity=".85"/>

    <!-- secondary fins -->
    <path d="M110 225 C96 216 82 220 74 235 C88 237 100 244 109 255Z" fill="#4e534e" opacity=".34"/>
    <path d="M190 225 C204 216 218 220 226 235 C212 237 200 244 191 255Z" fill="#4e534e" opacity=".34"/>
  </g>

  <!-- brush ribs in fins -->
  <g fill="none" stroke="#313733" stroke-linecap="round" opacity=".26">
    <path d="M145 103 C132 78 118 52 108 27"/><path d="M149 101 C141 70 130 43 117 21"/>
    <path d="M155 103 C168 78 182 52 192 27"/><path d="M151 101 C159 70 170 43 183 21"/>
    <path d="M108 366 C80 359 55 361 36 370"/><path d="M107 375 C79 370 57 373 42 382"/>
    <path d="M192 366 C220 359 245 361 264 370"/><path d="M193 375 C221 370 243 373 258 382"/>
  </g>

  <!-- head and face -->
  <ellipse cx="150" cy="421" rx="31" ry="39" fill="#242a26" opacity=".74"/>
  <ellipse cx="136" cy="419" rx="5.2" ry="7.6" fill="#111512" opacity=".92"/>
  <ellipse cx="164" cy="419" rx="5.2" ry="7.6" fill="#111512" opacity=".92"/>
  <circle cx="137" cy="417" r="1.2" fill="#ebe7dd" opacity=".78"/><circle cx="163" cy="417" r="1.2" fill="#ebe7dd" opacity=".78"/>
  <path d="M138 447 C146 452 154 452 162 447" fill="none" stroke="#252a26" stroke-width="2.2" stroke-linecap="round" opacity=".48"/>
  <path d="M138 449 C128 455 122 462 118 470" fill="none" stroke="#3f4540" stroke-width="1.7" stroke-linecap="round" opacity=".62"/>
  <path d="M162 449 C172 455 178 462 182 470" fill="none" stroke="#3f4540" stroke-width="1.7" stroke-linecap="round" opacity=".62"/>
</svg>