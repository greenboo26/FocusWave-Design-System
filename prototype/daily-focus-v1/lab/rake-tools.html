<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>FocusWave Lab · Karesansui Physical Drawer</title>
<style>
:root{--page:#f3f1ec;--sand:#fbfaf6;--ink:#5d625f;--muted:#909590;--line:#d8d5cd}
*{box-sizing:border-box} body{margin:0;background:var(--page);font-family:Inter,"Noto Sans SC",system-ui,sans-serif;color:var(--ink)}
main{max-width:1120px;margin:auto;padding:34px 24px 70px} header{display:flex;justify-content:space-between;gap:24px;align-items:flex-start;margin-bottom:18px}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:7px} h1{font-size:25px;font-weight:500;margin:0 0 8px} .desc{max-width:820px;color:var(--muted);font-size:13px;line-height:1.7} .back{font-size:13px;color:var(--muted);text-decoration:none}
.board{position:relative;border:1px solid #d4d0c7;border-radius:20px;overflow:hidden;background:var(--sand);box-shadow:0 12px 35px rgba(74,69,59,.06)}
.sand{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 20% 30%,rgba(91,82,67,.028) 0 .7px,transparent .8px),radial-gradient(circle at 70% 63%,rgba(91,82,67,.022) 0 .65px,transparent .75px),var(--sand);background-size:8px 8px,11px 11px,auto}
canvas{position:relative;display:block;width:100%;height:620px;touch-action:none;cursor:none}
.tool-cursor{position:absolute;left:0;top:0;pointer-events:none;z-index:8;opacity:0;transform-origin:50% 70%} .tool-cursor.visible{opacity:.96} .tool-cursor img{display:block;filter:drop-shadow(0 4px 3px rgba(58,40,24,.24));transform-origin:50% 70%}
.tool-cursor.fine img{width:65px;transform:translate(-34px,-61px) rotate(-12deg)} .tool-cursor.medium img{width:66px;transform:translate(-34px,-61px) rotate(-11deg)} .tool-cursor.coarse img{width:62px;transform:translate(-32px,-59px) rotate(-10deg)} .tool-cursor.flatten img{width:82px;transform:translate(-43px,-65px) rotate(-10deg)}
.drawer{position:absolute;right:-300px;bottom:18px;width:420px;z-index:7;transition:transform .42s cubic-bezier(.22,.75,.22,1);filter:drop-shadow(0 12px 14px rgba(68,47,30,.18))} .drawer.open{transform:translateX(-282px)}
.drawer-img{display:block;width:100%;height:auto;user-select:none;pointer-events:none} .drawer-toggle{position:absolute;right:2px;top:42%;width:62px;height:42px;border:0;background:transparent;cursor:pointer}
.hit{position:absolute;border:0;background:transparent;cursor:pointer;z-index:2;padding:0} .hit:focus-visible{outline:1px solid rgba(92,78,61,.45);border-radius:12px} .hit::after{content:"";position:absolute;inset:20%;border-radius:50%;opacity:0;box-shadow:0 0 18px 8px rgba(255,248,231,.72);transition:.16s} .hit.active::after{opacity:.72}
.hit.fine{left:7%;top:13%;width:32%;height:51%} .hit.medium{left:34%;top:25%;width:28%;height:45%} .hit.coarse{left:55%;top:34%;width:24%;height:42%} .hit.flatten{left:69%;top:33%;width:27%;height:48%}
.controls{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:10px;font-size:12px;color:var(--muted)} .actions{display:flex;gap:8px} .actions button{border:0;background:transparent;color:#858a85;font:inherit;font-size:12px;padding:5px 7px;cursor:pointer} .actions button:hover{color:#5f645f} code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#666b68}
@media(max-width:760px){canvas{height:500px} .drawer{width:330px;right:-242px} .drawer.open{transform:translateX(-225px)} header,.controls{display:block} .actions{margin-top:7px} .back{display:inline-block;margin-top:14px}}
</style>
</head>
<body><main>
<header><div><div class="eyebrow">FocusWave / isolated PoC / real rendered garden tools</div><h1>枯山水 · 真实庭具 / 右侧抽拉托盘</h1><div class="desc">右侧只露出木托盘的拉手；拉开后直接从真实木质庭具中选择。工具不再由 CSS 伪装成木头，沙面上的系统光标也由当前庭具实体替代。白砂与纹路逻辑保持独立。</div></div><a class="back" href="./index.html">← 返回实验目录</a></header>
<div class="board" id="board"><div class="sand"></div><canvas id="garden"></canvas>
<div class="tool-cursor fine" id="toolCursor"><img id="cursorImg" alt=""/></div>
<div class="drawer" id="drawer" aria-label="右侧庭具抽拉托盘"><img class="drawer-img" alt="木质庭具托盘" src="./assets/karesansui/tray.webp"/><button class="drawer-toggle" id="drawerToggle" aria-label="打开或收起庭具托盘"></button><button class="hit fine active" data-tool="fine" aria-label="细耙 7 齿"></button><button class="hit medium" data-tool="medium" aria-label="中耙 5 齿"></button><button class="hit coarse" data-tool="coarse" aria-label="粗耙 3 齿"></button><button class="hit flatten" data-tool="flatten" aria-label="平整棒"></button></div>
</div>
<div class="controls"><span id="status">0 actions · 细耙 7 齿</span><div class="actions"><button id="undo">撤销</button><button id="reset">重置白砂</button></div></div>
</main>
<script type="module">
import { getStrokePoints } from 'https://esm.sh/perfect-freehand@1.2.3';
const ASSETS={fine:'./assets/karesansui/fine.webp',medium:'./assets/karesansui/medium.webp',coarse:'./assets/karesansui/coarse.webp',flatten:'./assets/karesansui/flatten.webp'};
const LABELS={fine:'细耙 7 齿',medium:'中耙 5 齿',coarse:'粗耙 3 齿',flatten:'平整棒'};
const specs={fine:{teeth:7,spacing:3.6,width:.72,alpha:.56},medium:{teeth:5,spacing:5.8,width:.82,alpha:.58},coarse:{teeth:3,spacing:9.2,width:.95,alpha:.60},flatten:{eraseWidth:54}};
const canvas=document.querySelector('#garden'),ctx=canvas.getContext('2d'),board=document.querySelector('#board'),drawer=document.querySelector('#drawer'),toolCursor=document.querySelector('#toolCursor'),cursorImg=document.querySelector('#cursorImg'),status=document.querySelector('#status'); let tool='fine',actions=[],current=null;
cursorImg.src=ASSETS.fine;
function dpr(){return Math.min(devicePixelRatio||1,2)} function fit(){const r=canvas.getBoundingClientRect(),p=dpr(),w=Math.round(r.width*p),h=Math.round(r.height*p);if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;redraw()}}
function localPoint(e){const r=canvas.getBoundingClientRect(),p=dpr();return[(e.clientX-r.left)*p,(e.clientY-r.top)*p,e.pressure||.5]}
function cleanPoints(points){if(points.length<2)return points.map(p=>({point:[p[0],p[1]]}));return getStrokePoints(points,{size:1,thinning:0,smoothing:.86,streamline:.58,simulatePressure:false})}
function normalAt(pts,i){const a=pts[Math.max(0,i-1)].point,b=pts[Math.min(pts.length-1,i+1)].point;let dx=b[0]-a[0],dy=b[1]-a[1],len=Math.hypot(dx,dy)||1;dx/=len;dy/=len;return[-dy,dx]}
function renderRake(a){const s=specs[a.tool],pts=cleanPoints(a.points);if(pts.length<2)return;ctx.save();ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=s.width*dpr();ctx.strokeStyle=`rgba(125,118,106,${s.alpha})`;const c=(s.teeth-1)/2;for(let t=0;t<s.teeth;t++){const off=(t-c)*s.spacing*dpr();ctx.beginPath();pts.forEach((sp,i)=>{const n=normalAt(pts,i),x=sp.point[0]+n[0]*off,y=sp.point[1]+n[1]*off;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke()}ctx.restore()}
function renderFlatten(a){const pts=cleanPoints(a.points);if(pts.length<2)return;ctx.save();ctx.globalCompositeOperation='destination-out';ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=specs.flatten.eraseWidth*dpr();ctx.beginPath();pts.forEach((sp,i)=>i?ctx.lineTo(sp.point[0],sp.point[1]):ctx.moveTo(sp.point[0],sp.point[1]));ctx.stroke();ctx.restore()}
function renderAction(a){a.tool==='flatten'?renderFlatten(a):renderRake(a)} function redraw(){ctx.clearRect(0,0,canvas.width,canvas.height);actions.forEach(renderAction);if(current)renderAction(current);status.textContent=`${actions.length} actions · ${LABELS[tool]}`}
function moveCursor(e){const r=board.getBoundingClientRect();toolCursor.style.left=`${e.clientX-r.left}px`;toolCursor.style.top=`${e.clientY-r.top}px`}
canvas.addEventListener('pointerenter',e=>{toolCursor.classList.add('visible');moveCursor(e)});canvas.addEventListener('pointerleave',()=>{if(!current)toolCursor.classList.remove('visible')});canvas.addEventListener('pointermove',e=>{moveCursor(e);if(!current||!canvas.hasPointerCapture(e.pointerId))return;const p=localPoint(e),last=current.points.at(-1);if(Math.hypot(p[0]-last[0],p[1]-last[1])>1.4*dpr())current.points.push(p);redraw()});canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);current={tool,points:[localPoint(e)]};redraw()});function finish(e){if(!current)return;if(current.points.length>1)actions.push(current);current=null;try{canvas.releasePointerCapture(e.pointerId)}catch{}redraw()}canvas.addEventListener('pointerup',finish);canvas.addEventListener('pointercancel',finish);
document.querySelector('#drawerToggle').addEventListener('click',()=>drawer.classList.toggle('open'));drawer.querySelectorAll('[data-tool]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();tool=b.dataset.tool;drawer.querySelectorAll('[data-tool]').forEach(x=>x.classList.toggle('active',x===b));toolCursor.className=`tool-cursor ${tool}`;cursorImg.src=ASSETS[tool];redraw()}));document.querySelector('#undo').addEventListener('click',()=>{actions.pop();redraw()});document.querySelector('#reset').addEventListener('click',()=>{actions=[];current=null;redraw()});new ResizeObserver(fit).observe(canvas);fit();
</script></body></html>
