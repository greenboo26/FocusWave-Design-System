<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>FocusWave Lab · Karesansui Tools</title>
  <style>
    :root{--page:#f3f1ec;--sand:#fbfaf6;--ink:#5d625f;--muted:#909590;--line:#d8d5cd;--wood:#c8a87c;--wood-dark:#9b7952;--wood-light:#e1c59a}
    *{box-sizing:border-box}
    body{margin:0;background:var(--page);font-family:Inter,"Noto Sans SC",system-ui,sans-serif;color:var(--ink)}
    main{max-width:1120px;margin:0 auto;padding:34px 24px 70px}
    header{display:flex;justify-content:space-between;gap:24px;align-items:flex-start;margin-bottom:18px}
    .eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
    h1{font-size:25px;font-weight:500;margin:0 0 8px}
    .desc{max-width:820px;color:var(--muted);font-size:13px;line-height:1.7}
    .back{font-size:13px;color:var(--muted);text-decoration:none}
    .board{position:relative;border:1px solid #d4d0c7;border-radius:20px;overflow:hidden;background:var(--sand);box-shadow:0 12px 35px rgba(74,69,59,.06)}
    .sand{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 20% 30%,rgba(91,82,67,.028) 0 0.7px,transparent .8px),radial-gradient(circle at 70% 63%,rgba(91,82,67,.022) 0 0.65px,transparent .75px),var(--sand);background-size:8px 8px,11px 11px,auto}
    canvas{position:relative;display:block;width:100%;height:620px;touch-action:none;cursor:none}

    .tool-cursor{position:absolute;left:0;top:0;width:72px;height:88px;pointer-events:none;z-index:5;opacity:0;transform:translate(-36px,-72px) rotate(-7deg);transition:opacity .08s ease}
    .tool-cursor.visible{opacity:.9}
    .tool-cursor .tool-entity{left:36px;top:40px;transform:translate(-50%,-50%);filter:drop-shadow(0 2px 2px rgba(66,48,30,.14))}

    .tool-area{display:flex;align-items:center;gap:14px;margin-top:14px}
    .tool-tray{position:relative;flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;min-height:112px;padding:13px 15px 12px;border:1px solid #cbb899;border-radius:16px;background:linear-gradient(180deg,#d7bd94 0%,#c7a477 100%);box-shadow:inset 0 1px rgba(255,255,255,.52),0 7px 18px rgba(77,58,35,.07)}
    .tool-tray:before{content:"";position:absolute;inset:7px;border:1px solid rgba(111,82,47,.15);border-radius:11px;pointer-events:none}
    .tool-slot{position:relative;min-height:84px;border-radius:10px;cursor:pointer;background:rgba(244,226,198,.17);box-shadow:inset 0 1px 4px rgba(91,65,37,.11);transition:background .15s ease,box-shadow .15s ease}
    .tool-slot:hover{background:rgba(247,231,205,.25)}
    .tool-slot.active{background:rgba(250,237,216,.34);box-shadow:inset 0 0 0 1px rgba(93,69,42,.34),inset 0 2px 5px rgba(91,65,37,.11)}
    .tool-name{position:absolute;left:8px;right:8px;bottom:6px;text-align:center;font-size:10px;color:#6e5941;letter-spacing:.02em}

    .tool-entity{--head:30px;--teeth-width:24px;position:absolute;left:50%;top:34px;width:66px;height:50px;transform:translate(-50%,-50%) rotate(-7deg);pointer-events:none}
    .handle{position:absolute;left:50%;top:0;width:5px;height:32px;border-radius:3px;background:linear-gradient(90deg,var(--wood-dark),var(--wood-light),var(--wood-dark));transform:translateX(-50%);box-shadow:0 1px 1px rgba(67,45,21,.16)}
    .rake-head{position:absolute;left:50%;top:27px;width:var(--head);height:5px;border-radius:3px;background:linear-gradient(180deg,var(--wood-light),var(--wood-dark));transform:translateX(-50%);box-shadow:0 1px 1px rgba(67,45,21,.18)}
    .teeth{position:absolute;left:50%;top:31px;width:var(--teeth-width);height:16px;transform:translateX(-50%);display:flex;justify-content:space-between;align-items:flex-start}
    .teeth i{display:block;width:2px;height:15px;border-radius:0 0 2px 2px;background:linear-gradient(90deg,var(--wood-dark),var(--wood-light))}
    .fine{--head:29px;--teeth-width:22px}.medium{--head:31px;--teeth-width:24px}.coarse{--head:27px;--teeth-width:19px}
    .flatten{--head:50px}.flatten .handle{height:29px}.flatten .rake-head{top:26px;height:9px;border-radius:6px}.flatten .teeth{display:none}
    .tool-slot .tool-entity{transform:translate(-50%,-50%) rotate(-11deg) scale(1.22)}

    .actions{display:flex;gap:7px;flex:0 0 auto}
    .actions button{border:1px solid var(--line);background:#faf9f5;color:#747872;border-radius:999px;padding:8px 13px;font:inherit;font-size:11px;cursor:pointer}
    .footer{display:flex;justify-content:space-between;gap:18px;margin-top:10px;font-size:12px;color:var(--muted);line-height:1.7}
    code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#666b68}
    @media(max-width:760px){canvas{height:500px}.tool-area{display:block}.actions{margin-top:9px}.tool-tray{gap:6px;padding:11px}.tool-slot .tool-entity{transform:translate(-50%,-50%) rotate(-11deg) scale(1.04)}.footer,header{display:block}.back{display:inline-block;margin-top:15px}}
  </style>
</head>
<body>
<main>
  <header>
    <div>
      <div class="eyebrow">FocusWave / isolated PoC / physical karesansui tools</div>
      <h1>枯山水 · 实体庭具 / 浅木工具槽</h1>
      <div class="desc">白砂初始保持干净。细耙、中耙、粗耙和平整棒横放在低矮浅木槽里；进入沙面后，当前工具本体替代系统光标。耙齿实体宽度与实际生成的砂纹宽度使用同一组参数，不再出现“大耙子画出一小撮线”的比例错位。</div>
    </div>
    <a class="back" href="./index.html">← 返回实验目录</a>
  </header>

  <div class="board" id="board">
    <div class="sand"></div>
    <canvas id="garden"></canvas>
    <div class="tool-cursor" id="toolCursor" aria-hidden="true"></div>
  </div>

  <div class="tool-area">
    <div class="tool-tray" id="toolTray" aria-label="庭具浅木槽">
      <div class="tool-slot active" data-tool="fine">
        <div class="tool-entity fine"><span class="handle"></span><span class="rake-head"></span><span class="teeth"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span></div>
        <span class="tool-name">细耙 · 7 齿</span>
      </div>
      <div class="tool-slot" data-tool="medium">
        <div class="tool-entity medium"><span class="handle"></span><span class="rake-head"></span><span class="teeth"><i></i><i></i><i></i><i></i><i></i></span></div>
        <span class="tool-name">中耙 · 5 齿</span>
      </div>
      <div class="tool-slot" data-tool="coarse">
        <div class="tool-entity coarse"><span class="handle"></span><span class="rake-head"></span><span class="teeth"><i></i><i></i><i></i></span></div>
        <span class="tool-name">粗耙 · 3 齿</span>
      </div>
      <div class="tool-slot" data-tool="flatten">
        <div class="tool-entity flatten"><span class="handle"></span><span class="rake-head"></span><span class="teeth"></span></div>
        <span class="tool-name">平整棒</span>
      </div>
    </div>
    <div class="actions"><button id="undo">撤销</button><button id="reset">重置白砂</button></div>
  </div>

  <div class="footer">
    <span id="status">0 actions · fine</span>
    <span><code>actions[]</code> 是唯一纹路来源；工具实体仅负责交互呈现。</span>
  </div>
</main>

<script type="module">
import { getStrokePoints } from 'https://esm.sh/perfect-freehand@1.2.3';

const canvas=document.querySelector('#garden');
const ctx=canvas.getContext('2d');
const toolTray=document.querySelector('#toolTray');
const board=document.querySelector('#board');
const toolCursor=document.querySelector('#toolCursor');
const status=document.querySelector('#status');
let tool='fine';
let actions=[];
let current=null;

const specs={
  fine:{teeth:7,spacing:3.6,width:.72,alpha:.56},
  medium:{teeth:5,spacing:5.8,width:.82,alpha:.58},
  coarse:{teeth:3,spacing:9.2,width:.95,alpha:.60},
  flatten:{eraseWidth:54}
};

function entityWidths(name){
  if(name==='flatten')return {head:50,teeth:0};
  const spec=specs[name];
  const trace=(spec.teeth-1)*spec.spacing;
  return {head:Math.round(trace+7),teeth:Math.round(trace)};
}
function toolMarkup(name){
  const w=entityWidths(name);
  if(name==='flatten')return `<div class="tool-entity flatten" style="--head:${w.head}px"><span class="handle"></span><span class="rake-head"></span><span class="teeth"></span></div>`;
  return `<div class="tool-entity ${name}" style="--head:${w.head}px;--teeth-width:${w.teeth}px"><span class="handle"></span><span class="rake-head"></span><span class="teeth">${'<i></i>'.repeat(specs[name].teeth)}</span></div>`;
}
function syncCursorTool(){toolCursor.innerHTML=toolMarkup(tool)}
syncCursorTool();

function dpr(){return Math.min(devicePixelRatio||1,2)}
function fit(){const r=canvas.getBoundingClientRect(),p=dpr();const w=Math.max(1,Math.round(r.width*p)),h=Math.max(1,Math.round(r.height*p));if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;redraw()}}
function localPoint(e){const r=canvas.getBoundingClientRect(),p=dpr();return[(e.clientX-r.left)*p,(e.clientY-r.top)*p,e.pressure||.5]}
function cleanPoints(points){if(points.length<2)return points.map(p=>({point:[p[0],p[1]]}));return getStrokePoints(points,{size:1,thinning:0,smoothing:.86,streamline:.58,simulatePressure:false})}
function normalAt(pts,i){const a=pts[Math.max(0,i-1)].point,b=pts[Math.min(pts.length-1,i+1)].point;let dx=b[0]-a[0],dy=b[1]-a[1];const len=Math.hypot(dx,dy)||1;dx/=len;dy/=len;return[-dy,dx]}
function renderRake(action){const spec=specs[action.tool],smooth=cleanPoints(action.points);if(smooth.length<2)return;ctx.save();ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=spec.width*dpr();ctx.strokeStyle=`rgba(125,118,106,${spec.alpha})`;const center=(spec.teeth-1)/2;for(let tooth=0;tooth<spec.teeth;tooth++){const off=(tooth-center)*spec.spacing*dpr();ctx.beginPath();smooth.forEach((sp,i)=>{const n=normalAt(smooth,i),x=sp.point[0]+n[0]*off,y=sp.point[1]+n[1]*off;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke()}ctx.restore()}
function renderFlatten(action){const smooth=cleanPoints(action.points);if(smooth.length<2)return;ctx.save();ctx.globalCompositeOperation='destination-out';ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=specs.flatten.eraseWidth*dpr();ctx.beginPath();smooth.forEach((sp,i)=>i?ctx.lineTo(sp.point[0],sp.point[1]):ctx.moveTo(sp.point[0],sp.point[1]));ctx.stroke();ctx.restore()}
function renderAction(a){a.tool==='flatten'?renderFlatten(a):renderRake(a)}
function redraw(){ctx.clearRect(0,0,canvas.width,canvas.height);actions.forEach(renderAction);if(current)renderAction(current);status.textContent=`${actions.length} actions · ${tool}`}

function moveToolCursor(e){const r=board.getBoundingClientRect();toolCursor.style.left=`${e.clientX-r.left}px`;toolCursor.style.top=`${e.clientY-r.top}px`}
canvas.addEventListener('pointerenter',e=>{toolCursor.classList.add('visible');moveToolCursor(e)});
canvas.addEventListener('pointerleave',()=>{if(!current)toolCursor.classList.remove('visible')});
canvas.addEventListener('pointermove',e=>{moveToolCursor(e);if(!current||!canvas.hasPointerCapture(e.pointerId))return;const p=localPoint(e),last=current.points[current.points.length-1];if(Math.hypot(p[0]-last[0],p[1]-last[1])>1.4*dpr())current.points.push(p);redraw()});
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);current={tool,points:[localPoint(e)]};toolCursor.classList.add('visible');moveToolCursor(e);redraw()});
function finish(e){if(!current)return;if(current.points.length>1)actions.push(current);current=null;try{canvas.releasePointerCapture(e.pointerId)}catch{}redraw()}
canvas.addEventListener('pointerup',finish);canvas.addEventListener('pointercancel',finish);

toolTray.querySelectorAll('[data-tool]').forEach(slot=>slot.addEventListener('click',()=>{tool=slot.dataset.tool;toolTray.querySelectorAll('[data-tool]').forEach(s=>s.classList.toggle('active',s===slot));syncCursorTool();status.textContent=`${actions.length} actions · ${tool}`}));
document.querySelector('#undo').addEventListener('click',()=>{actions.pop();redraw()});
document.querySelector('#reset').addEventListener('click',()=>{actions=[];current=null;redraw()});

new ResizeObserver(fit).observe(canvas);fit();
</script>
</body>
</html>
