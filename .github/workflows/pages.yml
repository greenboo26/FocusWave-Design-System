name: Deploy FocusWave Preview

on:
  push:
    branches: [main]
    paths:
      - 'prototype/daily-focus-v1/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload FocusWave preview
        uses: actions/upload-pages-artifact@v3
        with:
          path: prototype/daily-focus-v1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
