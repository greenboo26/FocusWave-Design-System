<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>FocusWave Lab · Karesansui Physical Scale</title>
<style>
:root{--page:#f3f1ec;--sand:#fbfaf6;--ink:#5d625f;--muted:#909590;--line:#d8d5cd}
*{box-sizing:border-box} body{margin:0;background:var(--page);font-family:Inter,"Noto Sans SC",system-ui,sans-serif;color:var(--ink)}
main{max-width:1180px;margin:auto;padding:34px 24px 70px} header{display:flex;justify-content:space-between;gap:24px;align-items:flex-start;margin-bottom:18px}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:7px} h1{font-size:25px;font-weight:500;margin:0 0 8px}.desc{max-width:850px;color:var(--muted);font-size:13px;line-height:1.7}.back{font-size:13px;color:var(--muted);text-decoration:none}
.board{position:relative;border:1px solid #d4d0c7;border-radius:20px;overflow:hidden;background:var(--sand);box-shadow:0 12px 35px rgba(74,69,59,.06)}
.sand{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 20% 30%,rgba(91,82,67,.028) 0 .7px,transparent .8px),radial-gradient(circle at 70% 63%,rgba(91,82,67,.022) 0 .65px,transparent .75px),var(--sand);background-size:8px 8px,11px 11px,auto}
canvas{position:relative;display:block;width:100%;height:660px;touch-action:none;cursor:none}
.tool-cursor{position:absolute;left:0;top:0;pointer-events:none;z-index:8;opacity:0}.tool-cursor.visible{opacity:.97}.tool-cursor img{display:block;filter:drop-shadow(0 7px 5px rgba(58,40,24,.22));transform-origin:18% 78%;user-select:none}
/* One physical scale: image size and sand-contact width are calibrated together. */
.tool-cursor.fine img{width:184px;transform:translate(-42px,-146px) rotate(-12deg)}
.tool-cursor.medium img{width:174px;transform:translate(-40px,-139px) rotate(-11deg)}
.tool-cursor.coarse img{width:164px;transform:translate(-38px,-131px) rotate(-10deg)}
.tool-cursor.flatten img{width:188px;transform:translate(-45px,-148px) rotate(-10deg)}
.drawer{position:absolute;right:-468px;bottom:16px;width:650px;z-index:7;transition:transform .42s cubic-bezier(.22,.75,.22,1);filter:drop-shadow(0 15px 17px rgba(68,47,30,.18))}.drawer.open{transform:translateX(-446px)}
.drawer-img{display:block;width:100%;height:auto;user-select:none;pointer-events:none}.drawer-toggle{position:absolute;right:0;top:38%;width:84px;height:64px;border:0;background:transparent;cursor:pointer}
.hit{position:absolute;border:0;background:transparent;cursor:pointer;z-index:2;padding:0}.hit:focus-visible{outline:1px solid rgba(92,78,61,.45);border-radius:14px}.hit::after{content:"";position:absolute;inset:18%;border-radius:50%;opacity:0;box-shadow:0 0 24px 10px rgba(255,248,231,.76);transition:.16s}.hit.active::after{opacity:.7}
.hit.fine{left:5%;top:10%;width:33%;height:56%}.hit.medium{left:31%;top:22%;width:30%;height:49%}.hit.coarse{left:53%;top:31%;width:26%;height:44%}.hit.flatten{left:68%;top:31%;width:28%;height:50%}
.controls{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:10px;font-size:12px;color:var(--muted)}.actions{display:flex;gap:8px}.actions button{border:0;background:transparent;color:#858a85;font:inherit;font-size:12px;padding:5px 7px;cursor:pointer}.actions button:hover{color:#5f645f}.scale-note{font-variant-numeric:tabular-nums}code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#666b68}
@media(max-width:760px){canvas{height:520px}.drawer{width:500px;right:-366px}.drawer.open{transform:translateX(-350px)}.tool-cursor.fine img{width:146px;transform:translate(-34px,-116px) rotate(-12deg)}.tool-cursor.medium img{width:139px;transform:translate(-32px,-111px) rotate(-11deg)}.tool-cursor.coarse img{width:132px;transform:translate(-31px,-105px) rotate(-10deg)}.tool-cursor.flatten img{width:150px;transform:translate(-36px,-118px) rotate(-10deg)}header,.controls{display:block}.actions{margin-top:7px}.back{display:inline-block;margin-top:14px}}
</style>
</head>
<body><main>
<header><div><div class="eyebrow">FocusWave / isolated PoC / calibrated physical scale</div><h1>枯山水 · 真实庭具 / 统一实体尺度</h1><div class="desc">这一版不再分别目测缩放“图片”和“砂纹”。每件庭具都绑定一个实际接触宽度：实体耙头越宽，生成的砂纹就同步越宽；右侧抽拉托盘也按同一尺度放大。目标是让托盘里的工具、沙面上的工具和留下的纹路属于同一个真实量级。</div></div><a class="back" href="./index.html">← 返回实验目录</a></header>
<div class="board" id="board"><div class="sand"></div><canvas id="garden"></canvas>
<div class="tool-cursor fine" id="toolCursor"><img id="cursorImg" alt=""/></div>
<div class="drawer" id="drawer" aria-label="右侧庭具抽拉托盘"><img class="drawer-img" alt="木质庭具托盘" src="./assets/karesansui/tray.webp"/><button class="drawer-toggle" id="drawerToggle" aria-label="打开或收起庭具托盘"></button><button class="hit fine active" data-tool="fine" aria-label="细耙 7 齿"></button><button class="hit medium" data-tool="medium" aria-label="中耙 5 齿"></button><button class="hit coarse" data-tool="coarse" aria-label="粗耙 3 齿"></button><button class="hit flatten" data-tool="flatten" aria-label="平整棒"></button></div>
</div>
<div class="controls"><span id="status">0 actions · 细耙 7 齿</span><span class="scale-note" id="scaleNote">接触宽度 72px · 齿距 12px</span><div class="actions"><button id="undo">撤销</button><button id="reset">重置白砂</button></div></div>
</main>
<script type="module">
import { getStrokePoints } from 'https://esm.sh/perfect-freehand@1.2.3';
const ASSETS={fine:'./assets/karesansui/fine.webp',medium:'./assets/karesansui/medium.webp',coarse:'./assets/karesansui/coarse.webp',flatten:'./assets/karesansui/flatten.webp'};
const LABELS={fine:'细耙 7 齿',medium:'中耙 5 齿',coarse:'粗耙 3 齿',flatten:'平整棒'};
/* CSS-pixel physical calibration. Total rake span = (teeth - 1) * spacing. */
const specs={
  fine:{teeth:7,spacing:12,width:1.15,alpha:.50,contact:72},
  medium:{teeth:5,spacing:15,width:1.25,alpha:.52,contact:60},
  coarse:{teeth:3,spacing:21,width:1.4,alpha:.55,contact:42},
  flatten:{eraseWidth:96,contact:96}
};
const canvas=document.querySelector('#garden'),ctx=canvas.getContext('2d'),board=document.querySelector('#board'),drawer=document.querySelector('#drawer'),toolCursor=document.querySelector('#toolCursor'),cursorImg=document.querySelector('#cursorImg'),status=document.querySelector('#status'),scaleNote=document.querySelector('#scaleNote');let tool='fine',actions=[],current=null;
cursorImg.src=ASSETS.fine;
function dpr(){return Math.min(devicePixelRatio||1,2)}
function fit(){const r=canvas.getBoundingClientRect(),p=dpr(),w=Math.round(r.width*p),h=Math.round(r.height*p);if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;redraw()}}
function localPoint(e){const r=canvas.getBoundingClientRect(),p=dpr();return[(e.clientX-r.left)*p,(e.clientY-r.top)*p,e.pressure||.5]}
function cleanPoints(points){if(points.length<2)return points.map(p=>({point:[p[0],p[1]]}));return getStrokePoints(points,{size:1,thinning:0,smoothing:.86,streamline:.58,simulatePressure:false})}
function normalAt(pts,i){const a=pts[Math.max(0,i-1)].point,b=pts[Math.min(pts.length-1,i+1)].point;let dx=b[0]-a[0],dy=b[1]-a[1],len=Math.hypot(dx,dy)||1;dx/=len;dy/=len;return[-dy,dx]}
function renderRake(a){const s=specs[a.tool],pts=cleanPoints(a.points);if(pts.length<2)return;ctx.save();ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=s.width*dpr();ctx.strokeStyle=`rgba(125,118,106,${s.alpha})`;const c=(s.teeth-1)/2;for(let t=0;t<s.teeth;t++){const off=(t-c)*s.spacing*dpr();ctx.beginPath();pts.forEach((sp,i)=>{const n=normalAt(pts,i),x=sp.point[0]+n[0]*off,y=sp.point[1]+n[1]*off;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke()}ctx.restore()}
function renderFlatten(a){const pts=cleanPoints(a.points);if(pts.length<2)return;ctx.save();ctx.globalCompositeOperation='destination-out';ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=specs.flatten.eraseWidth*dpr();ctx.beginPath();pts.forEach((sp,i)=>i?ctx.lineTo(sp.point[0],sp.point[1]):ctx.moveTo(sp.point[0],sp.point[1]));ctx.stroke();ctx.restore()}
function renderAction(a){a.tool==='flatten'?renderFlatten(a):renderRake(a)}
function updateStatus(){const s=specs[tool];status.textContent=`${actions.length} actions · ${LABELS[tool]}`;scaleNote.textContent=tool==='flatten'?`接触宽度 ${s.contact}px`:`接触宽度 ${s.contact}px · 齿距 ${s.spacing}px`}
function redraw(){ctx.clearRect(0,0,canvas.width,canvas.height);actions.forEach(renderAction);if(current)renderAction(current);updateStatus()}
function moveCursor(e){const r=board.getBoundingClientRect();toolCursor.style.left=`${e.clientX-r.left}px`;toolCursor.style.top=`${e.clientY-r.top}px`}
canvas.addEventListener('pointerenter',e=>{toolCursor.classList.add('visible');moveCursor(e)});canvas.addEventListener('pointerleave',()=>{if(!current)toolCursor.classList.remove('visible')});canvas.addEventListener('pointermove',e=>{moveCursor(e);if(!current||!canvas.hasPointerCapture(e.pointerId))return;const p=localPoint(e),last=current.points.at(-1);if(Math.hypot(p[0]-last[0],p[1]-last[1])>1.4*dpr())current.points.push(p);redraw()});canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);current={tool,points:[localPoint(e)]};redraw()});function finish(e){if(!current)return;if(current.points.length>1)actions.push(current);current=null;try{canvas.releasePointerCapture(e.pointerId)}catch{}redraw()}canvas.addEventListener('pointerup',finish);canvas.addEventListener('pointercancel',finish);
document.querySelector('#drawerToggle').addEventListener('click',()=>drawer.classList.toggle('open'));drawer.querySelectorAll('[data-tool]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();tool=b.dataset.tool;drawer.querySelectorAll('[data-tool]').forEach(x=>x.classList.toggle('active',x===b));toolCursor.className=`tool-cursor ${tool}`;cursorImg.src=ASSETS[tool];redraw()}));document.querySelector('#undo').addEventListener('click',()=>{actions.pop();redraw()});document.querySelector('#reset').addEventListener('click',()=>{actions=[];current=null;redraw()});new ResizeObserver(fit).observe(canvas);fit();
</script></body></html>
