    <circle r="3" fill="#43564b" opacity=".42"/>
    <g stroke="#41564a" stroke-width="1.35" opacity=".23">
      <path d="M0,0 L0,-88"/><path d="M0,0 L42,-76"/><path d="M0,0 L76,-48"/><path d="M0,0 L90,-6"/><path d="M0,0 L79,44"/><path d="M0,0 L44,79"/><path d="M0,0 L-3,91"/><path d="M0,0 L-45,77"/><path d="M0,0 L-80,43"/><path d="M0,0 L-91,-2"/><path d="M0,0 L-75,-46"/><path d="M0,0 L-34,-82"/>
    </g>
    <circle r="78" fill="none" stroke="#f8f4e9" stroke-width="2.2" stroke-dasharray="3 9" opacity=".18"/>
  </symbol>
  <symbol id="padSoft" viewBox="-100 -100 200 200">
    <path d="M0,-92 C48,-91 90,-55 92,-7 C95,43 61,84 13,93 C-37,102 -81,73 -93,29 C-107,-22 -78,-69 -31,-87 L0,0 Z" fill="url(#leaf2)" filter="url(#wash)"/>
    <circle r="2.8" fill="#4c5c53" opacity=".27"/>
    <g stroke="#4a6054" stroke-width="1.1" opacity=".16">
      <path d="M0,0 L0,-86"/><path d="M0,0 L48,-72"/><path d="M0,0 L82,-31"/><path d="M0,0 L80,41"/><path d="M0,0 L45,76"/><path d="M0,0 L-6,88"/><path d="M0,0 L-53,70"/><path d="M0,0 L-86,20"/><path d="M0,0 L-76,-48"/><path d="M0,0 L-31,-83"/>
    </g>
  </symbol>
  <radialGradient id="washBlob" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#6c8276" stop-opacity=".08"/><stop offset="1" stop-color="#6c8276" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1600" height="840" fill="#f6f1e7"/>
<g filter="url(#paper)"><rect width="1600" height="840" fill="#f7f2e8" opacity=".88"/></g>
