name: Deploy FocusWave Preview

# Publishes the interactive daily-focus prototype to GitHub Pages.
# Every deployment rewrites versioned runtime URLs with the current commit SHA
# so the preview cannot silently reuse stale JavaScript from an older run.
on:
  push:
    branches: [main, li]
    paths:
      - 'prototype/daily-focus-v1/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages-li
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare cache-busted preview
        shell: bash
        run: |
          rm -rf _site
          cp -R prototype/daily-focus-v1 _site
          find _site -type f \( -name '*.html' -o -name '*.js' \) -print0 \
            | xargs -0 sed -E -i "s/\\?v=[0-9]+/?rev=${GITHUB_SHA}/g"

      - name: Upload FocusWave preview
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
