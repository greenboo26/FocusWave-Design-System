<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>FocusWave Lab · Karesansui Tools</title>
  <style>
    :root{--page:#f3f1ec;--sand:#fbfaf6;--ink:#5d625f;--muted:#909590;--line:#d8d5cd;--groove:#b9b4a9;--wood:#c8a87c;--wood-dark:#9e7d56;--wood-light:#e2c69d}
    *{box-sizing:border-box}
    body{margin:0;background:var(--page);font-family:Inter,"Noto Sans SC",system-ui,sans-serif;color:var(--ink)}
    main{max-width:1120px;margin:0 auto;padding:34px 24px 70px}
    header{display:flex;justify-content:space-between;gap:24px;align-items:flex-start;margin-bottom:18px}
    .eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
    h1{font-size:25px;font-weight:500;margin:0 0 8px}
    .desc{max-width:800px;color:var(--muted);font-size:13px;line-height:1.7}
    .back{font-size:13px;color:var(--muted);text-decoration:none}
    .workbench{display:grid;grid-template-columns:190px 1fr;gap:16px;align-items:start}
    .tool-dock{border:1px solid #c9b99f;border-radius:18px;padding:13px;background:linear-gradient(145deg,#d6bd98,#bc976a);box-shadow:inset 0 1px rgba(255,255,255,.45),0 10px 25px rgba(74,59,40,.08)}
    .dock-title{font-size:11px;letter-spacing:.12em;color:#6f5b43;margin:1px 3px 10px;text-transform:uppercase}
    .tool-slot{position:relative;height:92px;border:1px solid rgba(104,78,47,.22);border-radius:13px;margin:8px 0;background:linear-gradient(180deg,rgba(255,255,255,.20),rgba(93,67,38,.08));cursor:pointer;transition:.15s ease;overflow:hidden}
    .tool-slot:hover{transform:translateY(-1px)}
    .tool-slot.active{box-shadow:inset 0 0 0 1px rgba(92,72,48,.55),0 4px 12px rgba(77,56,32,.10);background:linear-gradient(180deg,rgba(255,255,255,.30),rgba(93,67,38,.10))}
    .tool-name{position:absolute;left:10px;bottom:7px;font-size:11px;color:#6e5941}
    .tool-entity{position:absolute;left:50%;top:38px;width:112px;height:38px;transform:translate(-50%,-50%) rotate(-7deg);pointer-events:none}
    .handle{position:absolute;left:50%;top:0;width:7px;height:30px;border-radius:4px;background:linear-gradient(90deg,var(--wood-dark),var(--wood-light),var(--wood-dark));transform:translateX(-50%);box-shadow:0 1px 1px rgba(67,45,21,.18)}
    .rake-head{position:absolute;left:50%;top:25px;height:7px;border-radius:4px;background:linear-gradient(180deg,var(--wood-light),var(--wood-dark));transform:translateX(-50%);box-shadow:0 1px 1px rgba(67,45,21,.20)}
    .teeth{position:absolute;left:50%;top:31px;height:16px;transform:translateX(-50%);display:flex;justify-content:space-between;align-items:flex-start}
    .teeth i{display:block;width:3px;height:15px;border-radius:0 0 2px 2px;background:linear-gradient(90deg,var(--wood-dark),var(--wood-light))}
    .fine .rake-head,.fine .teeth{width:72px}.medium .rake-head,.medium .teeth{width:66px}.coarse .rake-head,.coarse .teeth{width:62px}
    .flatten .handle{height:27px}.flatten .rake-head{top:24px;width:78px;height:12px;border-radius:7px}.flatten .teeth{display:none}
    .dock-actions{display:flex;gap:6px;margin-top:12px}
    .dock-actions button{flex:1;border:1px solid rgba(100,74,43,.25);background:rgba(251,247,238,.58);color:#6f5b43;border-radius:999px;padding:7px 8px;font:inherit;font-size:11px;cursor:pointer}
    .board{position:relative;border:1px solid #d4d0c7;border-radius:20px;overflow:hidden;background:var(--sand);box-shadow:0 12px 35px rgba(74,69,59,.06)}
    .sand{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 20% 30%,rgba(91,82,67,.028) 0 0.7px,transparent .8px),radial-gradient(circle at 70% 63%,rgba(91,82,67,.022) 0 0.65px,transparent .75px),var(--sand);background-size:8px 8px,11px 11px,auto}
    canvas{position:relative;display:block;width:100%;height:620px;touch-action:none;cursor:none}
    .tool-cursor{position:absolute;left:0;top:0;width:92px;height:92px;pointer-events:none;z-index:5;opacity:0;transform:translate(-46px,-75px) rotate(-9deg);transition:opacity .08s ease}
    .tool-cursor.visible{opacity:.88}
    .tool-cursor .tool-entity{left:46px;top:40px;transform:translate(-50%,-50%);filter:drop-shadow(0 3px 3px rgba(66,48,30,.16))}
    .footer{display:flex;justify-content:space-between;gap:18px;margin-top:12px;font-size:12px;color:var(--muted);line-height:1.7}
    code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#666b68}
    @media(max-width:820px){.workbench{grid-template-columns:1fr}.tool-dock{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.dock-title,.dock-actions{grid-column:1/-1}.tool-slot{margin:0;height:86px}canvas{height:500px}.footer,header{display:block}.back{display:inline-block;margin-top:15px}}
  </style>
</head>
<body>
<main>
  <header>
    <div>
      <div class="eyebrow">FocusWave / isolated PoC / physical karesansui tools</div>
      <h1>枯山水 · 木耙实体工具 / 浅木收纳槽</h1>
      <div class="desc">工具不再是普通按钮，也不再使用十字鼠标。细耙、中耙、粗耙和平整棒都作为木质实体放在浅木工具槽里；选中后，工具本体跟随指针进入白砂操作区。白砂初始仍保持干净，纹路只由用户手势产生。</div>
    </div>
    <a class="back" href="./index.html">← 返回实验目录</a>
  </header>

  <div class="workbench">
    <aside class="tool-dock" id="toolDock">
      <div class="dock-title">庭具 · wooden tools</div>
      <div class="tool-slot active" data-tool="fine">
        <div class="tool-entity fine"><span class="handle"></span><span class="rake-head"></span><span class="teeth"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span></div>
        <span class="tool-name">细耙 · 7 齿</span>
      </div>
      <div class="tool-slot" data-tool="medium">
        <div class="tool-entity medium"><span class="handle"></span><span class="rake-head"></span><span class="teeth"><i></i><i></i><i></i><i></i><i></i></span></div>
        <span class="tool-name">中耙 · 5 齿</span>
      </div>
      <div class="tool-slot" data-tool="coarse">
        <div class="tool-entity coarse"><span class="handle"></span><span class="rake-head"></span><span class="teeth"><i></i><i></i><i></i></span></div>
        <span class="tool-name">粗耙 · 3 齿</span>
      </div>
      <div class="tool-slot" data-tool="flatten">
        <div class="tool-entity flatten"><span class="handle"></span><span class="rake-head"></span><span class="teeth"></span></div>
        <span class="tool-name">平整棒</span>
      </div>
      <div class="dock-actions"><button id="undo">撤销</button><button id="reset">重置白砂</button></div>
    </aside>

    <div>
      <div class="board" id="board">
        <div class="sand"></div>
        <canvas id="garden"></canvas>
        <div class="tool-cursor" id="toolCursor" aria-hidden="true"></div>
      </div>
      <div class="footer">
        <span id="status">0 actions · fine</span>
        <span>工具实体只负责交互呈现；<code>actions[]</code> 仍是唯一纹路来源。</span>
      </div>
    </div>
  </div>
</main>

<script type="module">
import { getStrokePoints } from 'https://esm.sh/perfect-freehand@1.2.3';

const canvas=document.querySelector('#garden');
const ctx=canvas.getContext('2d');
const toolDock=document.querySelector('#toolDock');
const board=document.querySelector('#board');
const toolCursor=document.querySelector('#toolCursor');
const status=document.querySelector('#status');
let tool='fine';
let actions=[];
let current=null;

const specs={
  fine:{teeth:7,spacing:3.6,width:.72,alpha:.56},
  medium:{teeth:5,spacing:5.8,width:.82,alpha:.58},
  coarse:{teeth:3,spacing:9.2,width:.95,alpha:.60},
  flatten:{eraseWidth:54}
};

function toolMarkup(name){
  if(name==='flatten')return '<div class="tool-entity flatten"><span class="handle"></span><span class="rake-head"></span><span class="teeth"></span></div>';
  const count=specs[name].teeth;
  return `<div class="tool-entity ${name}"><span class="handle"></span><span class="rake-head"></span><span class="teeth">${'<i></i>'.repeat(count)}</span></div>`;
}
function syncCursorTool(){toolCursor.innerHTML=toolMarkup(tool)}
syncCursorTool();

function dpr(){return Math.min(devicePixelRatio||1,2)}
function fit(){
  const r=canvas.getBoundingClientRect(),p=dpr();
  const w=Math.max(1,Math.round(r.width*p)),h=Math.max(1,Math.round(r.height*p));
  if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;redraw()}
}
function localPoint(e){const r=canvas.getBoundingClientRect(),p=dpr();return[(e.clientX-r.left)*p,(e.clientY-r.top)*p,e.pressure||.5]}
function cleanPoints(points){if(points.length<2)return points.map(p=>({point:[p[0],p[1]]}));return getStrokePoints(points,{size:1,thinning:0,smoothing:.86,streamline:.58,simulatePressure:false})}
function normalAt(pts,i){const a=pts[Math.max(0,i-1)].point,b=pts[Math.min(pts.length-1,i+1)].point;let dx=b[0]-a[0],dy=b[1]-a[1];const len=Math.hypot(dx,dy)||1;dx/=len;dy/=len;return[-dy,dx]}
function renderRake(action){
  const spec=specs[action.tool],smooth=cleanPoints(action.points);if(smooth.length<2)return;
  ctx.save();ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=spec.width*dpr();ctx.strokeStyle=`rgba(125,118,106,${spec.alpha})`;
  const center=(spec.teeth-1)/2;
  for(let tooth=0;tooth<spec.teeth;tooth++){
    const off=(tooth-center)*spec.spacing*dpr();ctx.beginPath();
    smooth.forEach((sp,i)=>{const n=normalAt(smooth,i),x=sp.point[0]+n[0]*off,y=sp.point[1]+n[1]*off;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();
  }
  ctx.restore();
}
function renderFlatten(action){
  const smooth=cleanPoints(action.points);if(smooth.length<2)return;
  ctx.save();ctx.globalCompositeOperation='destination-out';ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=specs.flatten.eraseWidth*dpr();ctx.beginPath();
  smooth.forEach((sp,i)=>i?ctx.lineTo(sp.point[0],sp.point[1]):ctx.moveTo(sp.point[0],sp.point[1]));ctx.stroke();ctx.restore();
}
function renderAction(a){a.tool==='flatten'?renderFlatten(a):renderRake(a)}
function redraw(){ctx.clearRect(0,0,canvas.width,canvas.height);actions.forEach(renderAction);if(current)renderAction(current);status.textContent=`${actions.length} actions · ${tool}`}

function moveToolCursor(e){const r=board.getBoundingClientRect();toolCursor.style.left=`${e.clientX-r.left}px`;toolCursor.style.top=`${e.clientY-r.top}px`}
canvas.addEventListener('pointerenter',e=>{toolCursor.classList.add('visible');moveToolCursor(e)});
canvas.addEventListener('pointerleave',()=>{if(!current)toolCursor.classList.remove('visible')});
canvas.addEventListener('pointermove',e=>{moveToolCursor(e);if(!current||!canvas.hasPointerCapture(e.pointerId))return;const p=localPoint(e),last=current.points[current.points.length-1];if(Math.hypot(p[0]-last[0],p[1]-last[1])>1.4*dpr())current.points.push(p);redraw()});
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);current={tool,points:[localPoint(e)]};toolCursor.classList.add('visible');moveToolCursor(e);redraw()});
function finish(e){if(!current)return;if(current.points.length>1)actions.push(current);current=null;try{canvas.releasePointerCapture(e.pointerId)}catch{}redraw()}
canvas.addEventListener('pointerup',finish);canvas.addEventListener('pointercancel',finish);

toolDock.querySelectorAll('[data-tool]').forEach(slot=>slot.addEventListener('click',()=>{
  tool=slot.dataset.tool;toolDock.querySelectorAll('[data-tool]').forEach(s=>s.classList.toggle('active',s===slot));syncCursorTool();status.textContent=`${actions.length} actions · ${tool}`;
}));
document.querySelector('#undo').addEventListener('click',()=>{actions.pop();redraw()});
document.querySelector('#reset').addEventListener('click',()=>{actions=[];current=null;redraw()});

new ResizeObserver(fit).observe(canvas);fit();
</script>
</body>
</html>
